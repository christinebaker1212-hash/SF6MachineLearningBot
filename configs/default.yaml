# sf6bot default configuration. Do not edit for personal settings:
# copy overrides into configs/local.yaml (git-ignored); it is deep-merged on top.

game:
  exe_name: StreetFighter6.exe        # UNVERIFIED: confirm with `sf6bot list-windows`
  title_contains: "Street Fighter 6"  # fallback match on window title
  install_dir: null       # SF6 folder; null = detect from the running game
  character: Ryu
  controls: classic

capture:
  backend: dxcam          # dxcam (Windows, DXGI present timestamps) | mss (no present timestamps)
  dxcam_backend: dxgi     # dxgi | winrt (dxcam's Windows Graphics Capture path)
  device_idx: 0
  output_idx: null        # null = primary monitor. Set if the game is on another monitor.
  target_fps: 120         # dxcam polling rate; 0 = unpaced (may use a full CPU core)
  in_fights: false         # 0.18.0: fights capture the screen only when recording video (the bot plays from game state)

input:
  # sendinput_keyboard: the bot types on the keyboard (shares Player 1 with you).
  # virtual_pad: the bot gets its OWN virtual Xbox controller (vgamepad + ViGEmBus driver), so you
  #              can play against it with your keyboard/pad. mock: sends nothing (tests).
  backend: sendinput_keyboard
  min_hold_frames: 2            # reject sequences that hold a button < this many frames
  # Logical input -> keyboard key (names in sf6bot/keys.py).
  # UNVERIFIED vs. SF6 defaults: open SF6 Controls > Keyboard and make the game's
  # bindings match these (or change these to match the game), then confirm with
  # `sf6bot input-test` and the Training Mode input display.
  bindings:
    UP: W
    DOWN: S
    LEFT: A
    RIGHT: D
    LP: U
    MP: I
    HP: O
    LK: J
    MK: K
    HK: L
  # Logical input -> virtual Xbox pad button (used when backend: virtual_pad).
  # SF6 Classic pad layout as commonly documented: UNVERIFIED on the user's game. Check SF6
  # Controls > Controller, and verify with the input map (menu I), which reads the game's own
  # input bits.
  pad_bindings:
    UP: DPAD_UP
    DOWN: DPAD_DOWN
    LEFT: DPAD_LEFT
    RIGHT: DPAD_RIGHT
    LP: X
    MP: Y
    HP: RB
    LK: A
    MK: B
    HK: RT
  # Overlay buttons on P1's keyboard (vs CPU): face buttons, triggers and the d-pad press the key of
  # the same game input above (pad A = LK -> J). Menu-only buttons: MENU = ESC (user, 2026-10-02: ESC
  # opens the menu on keyboard). The others are not known yet: set them here (key names as in
  # bindings, e.g. ENTER, BACKSPACE, Q, E). Unset = the button is greyed out.
  menu_keys:
    A: F                  # menu CONFIRM on the keyboard (user, 2026-10-03: "menu controls use the F key")
    START: ESC
    BACK: null
    LB: null
    LT: null

# 0.18.8: ranked only. After a match the result screen's first option is confirmed with input.menu_keys.A (F):
# "Request Rematch", or "Return to Previous Mode" once the opponent declined and the rematch timer ran out. Nothing is
# pressed while the game reports no battle (Fighting Ground keeps searching for the next opponent by itself).
# Timings are ESTIMATES (seconds after the match ended); the first unattended session's log calibrates them.
result_menu:
  enabled: true
  first_s: 8          # the result menu is up (KO, win pose and quote skipped or over)
  retry_after_s: 30   # the rematch timer has run out: the first option is "Return to Previous Mode"
  retry_every_s: 12
  max_presses: 5
  stuck_s: 45         # a battle with a player at 0 hp this long without a match end (disconnect): treat as ended
# 0.18.8: outside a battle (Fighting Ground) the bot presses nothing, except for "A communication error has occurred."
# (read from the screen: screen_text.py). Then: F (OK), F (Ranked Match), Esc (back: searching again). User, 2026-10-04.
menu_watch:
  enabled: true
  every_s: 2.0
  error_phrase: "A communication error has occurred"
  steps: [["F", 0.0], ["F", 1.5], ["ESC", 1.5]]   # key, seconds to wait before it
  cooldown_s: 20
  max_tries: 3        # in a row without a battle in between; then it waits and the status log says so

training:
  reset_key: SLASH        # Training Mode "reset position" on the user's keyboard (user-reported: "/")

safety:
  kill_key: F8            # immediate stop + release all (works even when game is focused)
  pause_key: F7           # toggle pause (inputs released while paused)
  pad_kill_combo: [LS, RS] # controller kill: click BOTH thumbsticks (XInput pads; [] disables)
  flip_facing_key: F6     # manual facing flip (M1 has no facing detection yet)
  success_key: F9         # combo lab: "that try actually worked" (operator override, 0.12.5)
  skip_key: F10           # combo lab: skip the current route (keeps failing), go to the next one
  refocus_grace_s: 0.5    # wait after the game regains focus before re-arming
  start_countdown_s: 5    # time to click into the game before inputs start
  poll_s: 0.005

datasets:
  root: datasets          # demonstration datasets (replays, converted runs, move catalogs)

recording:
  root: runs
  record_video: true
  video_width: 640

overlay:
  enabled: true
  exclude_from_capture: false   # true hides it from screen capture AND from streaming apps like Parsec
  width: 640
  fps: 30

loop:
  max_frame_age_ms: 50    # do not act on frames older than this (stale) -> counted & skipped
  torch_threads: 2        # CPU threads for PyTorch inference; leave cores for the game
  obs_width: 128          # grayscale observation size fed to the policy
  obs_height: 72
  # Actions for the RANDOM baseline policy (relative directions; label RANDOM, not learned)
  random_actions: ["5", "6", "4", "2", "1", "3", "5+LP", "5+MP", "2+LK", "2+MK"]
  random_hold_frames: 6

latency_probe:
  key: LP
  hold_frames: 4
  trials: 30
  threshold: auto         # "auto" = 3 x measured idle noise + 2 (at least min_threshold), or a number
  min_threshold: 3.0      # mean abs pixel diff in the box
  timeout_s: 0.5
  settle_s: 1.0
