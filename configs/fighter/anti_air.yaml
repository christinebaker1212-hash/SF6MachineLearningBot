# 0.46.0: the user's anti-airs for the characters with no invincible 623 special (user, 2026-10-09: "Tell me the characters
# without an anti air special, and I will tell you their best anti air"). Read by fighter_profile.anti_air_options for every
# character but Ryu (Ryu keeps configs/fighter/ryu.yaml). Characters with a 623 anti-air special keep it (not listed here).
#
# `move`: a Capcom row name or part of one ("Somersault Kick" = Guile's Flash Kick). With no strength in it, the version
# invincible to air attacks from the earliest frame is used (else the fastest L / M / H); OD and CA rows only when named.
# `min_dist` / `max_dist`: where the move is used (the predicted landing's distance from the bot). Not given: a normal's
# measured reach (reach.py, else ryu.yaml punish.reach_fallback by name: Ryu's, an ESTIMATE for others), a special 1.3.
# Not usable here (the bot has no way into the state first): Chun-Li's Tenku Kick (Serenity Stream), Dee Jay's Maximum
# Strike (Jus Cool), Manon's Allongé (the second hit after 2HP).
A.K.I.:
  - {move: Standing Heavy Kick}
  # user: "MP and HP Serpent Lash (distance dependent)". Which is the close one is not in the data: H (invincible to air
  # attacks, 11F) close, M (14F, the longer active window) farther: TO CONFIRM with the user
  - {move: H Serpent Lash, max_dist: 1.3}
  - {move: M Serpent Lash, min_dist: 1.3, max_dist: 2.2}
