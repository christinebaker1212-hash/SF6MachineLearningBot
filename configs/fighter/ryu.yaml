# Scripted Ryu (Classic) for the first fights vs CPU. Hand-written rules, NOT learned.
# Every distance and timing below is PROVISIONAL (not yet measured in game) unless marked.
# Distances are game units, the same as the state exporter's x (pos / 6553600):
#   SuperCombo Ryu page: throw range 0.8, forward dash 1.252, jump 4+38+3 frames, apex 2.115.
#   Our catalog: walking into contact stops at ~0.70.
# Sequences use the bot notation (numpad relative to facing, @frames). Combo routes are the
# "Very Easy" ones from wiki.supercombo.gg/w/Street_Fighter_6/Ryu/Combos (user-provided link).

character: Ryu        # Versus Human: the side playing this character is the bot (else the input probe)
# 0.12.0: the learned neutral game (brain trained with menu B; learning per opponent in datasets/learning/).
# The reflex rules below (throw tech, DI reaction, anti-air, blocking, punishes) still come first.
policy:
  enabled: true
  decision_every_s: 0.12   # a neutral decision about every 7 frames (movement macros last 8)
  temperature: 0.8         # < 1 = closer to the most likely choice
  explore: 0.08            # share of decisions spread over every allowed option (to keep learning)
  # 0.16.0 win model (win_model.py): choices are re-weighted by exp(win_beta x trust x advantage); trust comes from
  # held-out matches (0 = not used). Ranked sessions retrain everything in the background every N matches.
  win_beta: 1.5
  retrain_every: 20
  retrain_in_all_modes: false
  # 0.20.7 (user, 2026-10-05: "It's using DI in fucking neutral. This is a travesty."): the neutral policy never picks a
  # Drive Impact. true = 0.20.6's behaviour (only through an opponent's projectile, never against a Super bar).
  neutral_drive_impact: false
ranges:
  throw: 0.80          # SuperCombo
  throw_attempt: 0.85  # 0.37.0 MEASURED (0.36.1, 225 bot throws): within 0.8 landed 55/59, 0.8-1.0 52/119, 1.0-1.3 11/43
  close: 1.00
  poke: 1.45           # 2MK / 5HP reach: guess, to be measured
  fireball_min: 2.30   # beyond this, throw Hadokens
  side_deadzone: 0.15  # |x difference| below this: keep the previous side (players overlapping)
anti_air:
  # MEASURED (fights 2026-10-02): Shoryukens that hit started at distance 0.60-1.24; those started at
  # 1.7-3.0 whiffed. The opponent's position is predicted lead_frames ahead (decision + input latency
  # + startup), and only real jumps count (ids.jump), not falling from a juggle or knockdown.
  lead_frames: 12      # (before 0.18.0: the prediction horizon; now timing comes from the landing)
  # 0.18.0: fired so the Shoryuken is active as the opponent comes down: landing in <= motion + input delay + start-up +
  # early_frames. 0.21.1: no anti-air normal (user: "Shoryuken is invincible to air attacks"): a late Shoryuken still goes
  # out while it can start before the landing (late_frames); later than that -> block.
  move: anti_air_srk
  late_frames: 4
  # 0.32.0: against an EMPTY jump (no attack in it) the Shoryuken's first active frame must come this many frames before
  # the landing (MEASURED: empty jumps landing before it: 2 hit / 7 blocked; attack jumps: 13 hit of 15); else block
  empty_jump_margin: 2
  gravity: 0.0123      # MEASURED: jumps last 37 frames and peak at 2.11 (most characters)
  early_frames: 6
  crossup_past: 0.3    # MEASURED: predicted landing this far past the bot = a cross-up (54/72, no false alarms)
  # 0.21.1 (user: "humans do not shoryuken every air attack. Our bot should."): only the predicted landing side decides.
  # Predicted to land on the side the opponent is on now -> Shoryuken (MEASURED, 295 near jump-ins in 63 ranked matches:
  # 93% landed in front, a Shoryuken sent at the decision hits 120 of 124 within 1.0; 39 of 40 within 0.25, which the
  # 0.19.0 rules - min_dist 0.25, overhead_dx 0.5 / overhead_min_y 0.9 - blocked); predicted to cross, or closer than
  # side_dead sideways now -> block toward the landing side. (min_dist / overhead_dx / overhead_min_y are no longer used.)
  side_dead: 0.05
  # 0.37.0 cross-cut Shoryuken (fighter._crosscut): a plain jump predicted to land behind the bot gets the Shoryuken facing
  # its CURRENT side when its hurtbox (moved along its arc) meets the Shoryuken's hitbox in an active frame. Hitbox MEASURED
  # from the bot's catalog boxes (L Shoryuken: 0.29-0.96 forward, from 0.27 high; top 1.17 / 1.49 / 1.75 on its first
  # active frames); `active` = Capcom's active frames 5-14.
  crosscut: {enabled: true}
  # 0.37.0 L Shoryuken's hitbox per own frame, MEASURED from the bot's catalog boxes (the catalog's frames include the
  # dummy's hitstop after frame 5; own frames here): [frame, forward from, forward to, height from, to]. Used by the
  # cross-cut and the Shoryuken answers (fighter._hitbox_meets). Capcom: active 5-14.
  srk_hitbox:
    - [5, 0.288, 0.888, 0.27, 1.17]
    - [6, 0.456, 0.956, 0.59, 1.49]
    - [7, 0.463, 0.963, 0.85, 1.75]
    - [8, 0.292, 0.792, 1.139, 2.339]
    - [9, 0.352, 0.852, 1.268, 2.468]
    - [10, 0.362, 0.862, 1.386, 2.586]
    - [11, 0.367, 0.867, 1.494, 2.694]
    - [12, 0.367, 0.867, 1.591, 2.791]
    - [13, 0.367, 0.867, 1.677, 2.877]
    - [14, 0.367, 0.867, 1.753, 2.953]
  # 0.21.1: frames the opponent must have been on its current side (since it last passed over the bot) before a
  # Shoryuken goes out; else block toward the landing side
  cross_settle: 2
  # 0.20.0 (user's pick "backup anti-air"): an opponent coming down out of Shoryuken range -> forward jump MP on the
  # way up. ESTIMATES.
  # 0.24.2: off (user: no attack starts with a jumping attack except after a DI stun in the corner)
  air_to_air: {enabled: false, min_dist: 1.3, max_dist: 2.2, seq: "9@3 5@4 5+MP@3"}
  # 0.21.0: anti-air readiness: an opponent in the air that will land within max_dist + ready_margin = start nothing
  # until the anti-air window (MEASURED: 47 of 96 near jump-ins with the bot free got a normal or special started
  # under them). On the bot's own wake-up (0.21.1: and out of blockstun): a reversal L Shoryuken when the opponent comes
  # down `wakeup_window` frames after the bot's first free frame (its active frames 5-14, air invincible 1-14: Capcom).
  ready_margin: 0.6
  wakeup_reversal: true
  wakeup_window: [3, 16]
  max_dist: 1.30
  max_height: 1.70
  block_lead_frames: 6 # blocking an airborne attack: hold back from where they will be in ~our input latency
throw_tech:
  # MEASURED: Ken's throw start-up (715 forward, 717 back) is visible for 5 frames before it connects
  # (720 / 724). Whether pressing LP+LK on seeing it is fast enough to tech is NOT known yet: our
  # input reaches the game 3-5 frames later. fight_summary counts the outcome.
  max_dist: 1.20
  # 0.23.0: also after the connect (the bot in a thrown state, 721 / 725): MEASURED (202 recordings, 1,670 throw start-ups)
  # an LP+LK read 1-7 frames after the connect still teched most throws (92 teched, 29 landed); from +8 none did (19)
  after_connect: true
# 0.18.0 input handling (MEASURED 0.17.5 ranked: Hadokens after walking forward came out as Shoryukens; ~27 of
# ~70 Shoryuken motions were sent while the bot could not act; "6@2 2@2 3+HP" came out as 2HP when the down step
# was missed, so motion steps are 3 frames)
# 0.18.1 (user: "Hasn't used a Super Art one time, or confirmed into SA3 - big damage opportunities being missed by
# punishing DI with grabs, or HP")
supers:
  crumple_ids: [276]        # MEASURED: the opponent after the bot's Drive Impact connects (18 of 18), 90-139 frames
  crumple_min_frames: 112   # MEASURED (0.20.3, ranked recordings): the shortest crumple; a combo's first hit lands before it
  di_recovery_frames: 85    # MEASURED: the bot's own DI animation after the crumple starts (16 of 18)
  crumple_max_dist: 1.1     # MEASURED: the crumpled opponent is ~0.72 away
  sa3_max_dist: 1.3         # SA3 as a punish only this close (estimate)
  confirm: true             # a 2MK chosen in neutral is confirmed into SA3 with full meter, or into a super that kills
# 0.26.0 (user: "the bot is missing damaging combo conversions. He requires more interactions to kill than his opponents
# do"). MEASURED 0.25.0 ranked (35 recordings): it died holding 1-3 Super bars in 7 of 8 lost matches; 12 SA3 and 27 SA1
# in 35 matches, none of them inside a combo it had started. Bars carry over between rounds, not past the match: what a
# kept bar is worth to the combo composer (hp, combo_compose._score) drops when the round can end the match (either side
# one round from winning) and again when the bot is low. ESTIMATES.
meter:
  bar_value: 250            # a kept Super bar, in hp (combo_compose.SUPER_BAR_VALUE)
  match_point_factor: 0.2   # x this in a round that can end the match: bars not spent there are lost either way
  low_hp: 0.35              # the bot at or below this share of its health...
  low_hp_factor: 0.5        # ...x this (it may not live to spend them)
  confirm_sa1_when_spending: true   # a 2MK confirm into SA1 whenever bars are cheap (else only when SA1 kills)
inputs:
  motion_clear_frames: 10   # MEASURED 0.19.0 ranked: neutral frames between letting go of forward and the motion's
                            # down: 4-5 -> Shoryuken 55 of 56; 8+ -> Hadoken 368 of 368. Counted from the release.
  # 0.32.0: a crouching punch within this many frames after down was let go reads as 22 + P (Denjin Charge): keep down
  # held, else wait (MEASURED: the accidental Denjin Charges spanned 3-15 frames; fighter.denjin_guard)
  denjin_guard_frames: 15
  # 0.38.1: a sequence ends holding down-back (standing back against an airborne opponent) within this distance instead
  # of letting go of everything (fighter.end_guard). MEASURED (0.37.x): 77 hits landed 0-3 frames after a full release
  end_guard_dist: 3.0
  dash_frames: 20           # a dash cannot be canceled: busy this long (estimate; Capcom has no dash total)
  unknown_move_frames: 30   # an own move with no catalogued total counts as busy this long
punish:
  # 0.41.0 (user: combo variety): punishes / crumple cash-outs of about the same value take turns: one log-normal factor
  # (sigma) per option per window, x repeat per earlier use this match (up to 4). The combo composer mixes its near-best
  # combos the same way in matches (combo_compose.VARIETY_*). A kill is never traded away.
  variety: {enabled: true, sigma: 0.12, repeat: 0.9}
  max_dist: 1.6        # 0.18.1 MEASURED: punishes after blocking connected up to ~1.7; 5MP was thrown from up to 3.65
  latency_frames: 4    # measured: input -> game sees it, 3-5 frames (usually 4)
  # on-block advantage (attacker) at or below the threshold -> that punish. Needs a catalog of the
  # OPPONENT's moves (datasets/catalog/<Opponent>_movelist.json); without one, no punishes.
  options:
    # `route`: performed by the combo lab's executor (0.11.3): every input timed from the game's own
    # clock, never before the move can come out. `seq` (wall-clock) is the fallback without Capcom data.
    - {max_adv: -10, name: "5HP > 623HP", route: "5HP > 623HP", seq: "5+HP@3 5@8 6@3 2@3 3+HP@3"}
    - {max_adv: -7,  name: "Shoryuken (623HP)", seq: "6@3 2@3 3+HP@3"}
    - {max_adv: -4,  name: "5LP ~ 2LP ~ 5LP", route: "5LP ~ 2LP ~ 5LP", seq: "5+LP@3 5@7 2+LP@3 5@7 5+LP@3"}
  # 0.23.0 the punish engine (sf6bot/punish.py; the options above are only used with `engine` empty). Every window the
  # opponent leaves (a blocked move, a whiff past its active frames, a Shoryuken coming down) gets the option with the
  # best expected damage that lands in it: the combo lab's TRUE combos first (they replace a route below with the same
  # starter), these, the bot's own catalogued pokes, a walk / dash / Parry Drive Rush in for whiffs out of reach.
  # Numbers are Capcom's (start-up, on block, damage; route damage = the two moves' listed damage, an ESTIMATE of the
  # scaled total); `id` = the bot's action id of the first move (its measured reach, reach.py), else `reach_fallback`.
  # Routes run on the game clock with hit confirm (combo_lab.perform_route): a blocked or whiffed starter sends no more.
  # 0.34.0: frames of super-flash freeze inside an opponent Super Art's own frames when its learned timing doesn't say
  # (MEASURED: Ken's SA1, contact on its frame 59, Capcom start-up 7)
  super_freeze: 52
  composed: true             # the combo composer's best combo from each ground normal is a punish option
  engine:
    - {name: "5HP > 623HP", route: "5HP > 623HP", starter: "Standing Heavy Punch", id: 608, startup: 10, damage: 2200,
       on_block: -2, seq: "5+HP@3 5@8 6@3 2@3 3+HP@3"}
    - {name: "2HP > 623HP", route: "2HP > 623HP", starter: "Crouching Heavy Punch", id: 630, startup: 9, damage: 2200,
       on_block: -7, seq: "2+HP@3 5@7 6@3 2@3 3+HP@3"}
    - {name: "5MP > 623HP", route: "5MP > 623HP", starter: "Standing Medium Punch", id: 605, startup: 6, damage: 2000,
       on_block: -1, seq: "5+MP@3 5@5 6@3 2@3 3+HP@3"}
    - {name: "2MP > 623HP", route: "2MP > 623HP", starter: "Crouching Medium Punch", id: 627, startup: 6, damage: 2000,
       on_block: 0, seq: "2+MP@3 5@5 6@3 2@3 3+HP@3"}
    - {name: "2MK > 623HP", route: "2MK > 623HP", starter: "Crouching Medium Kick", id: 640, startup: 8, damage: 1900,
       on_block: -6, seq: "2+MK@3 5@6 6@3 2@3 3+HP@3"}
    - {name: "5LP > 623HP", route: "5LP > 623HP", starter: "Standing Light Punch", id: 600, startup: 4, damage: 1500,
       on_block: -1, seq: "5+LP@3 5@3 6@3 2@3 3+HP@3"}
    - {name: "2LP > 623HP", route: "2LP > 623HP", starter: "Crouching Light Punch", id: 622, startup: 4, damage: 1500,
       on_block: -1, seq: "2+LP@3 5@3 6@3 2@3 3+HP@3"}
    - {name: "Crouching Heavy Kick", seq: "2+HK@3", starter: "Crouching Heavy Kick", id: 643, startup: 9, damage: 900,
       on_block: -12}
    - {name: "Standing Heavy Kick", seq: "5+HK@3", starter: "Standing Heavy Kick", id: 617, startup: 12, damage: 900,
       on_block: 1}
    # 0.28.0: max_reach (the user's Akuma zoning, 2026-10-06): sent from 1.9-2.7 at a fireball's thrower, 56 of 58 H
    # Tatsumakis were hit by the next fireball (~44,000 damage in 3 matches); its first hit (frame 16) reaches ~1.6, the
    # later ones (31, 46: Capcom) come long after the thrower has recovered
    - {name: "H Tatsumaki Senpu-kyaku", seq: "2@3 1@3 4+HK@3", starter: "H Tatsumaki Senpu-kyaku", id: 1005, startup: 16,
       damage: 1200, on_block: -13, max_reach: 1.6}
    - {move: punish_l_srk, starter: "L Shoryuken", id: 930, damage: 1100, on_block: -23}
    # 0.34.0 (user: punish with combos, not raw supers): the Shoryuken super-cancelled into SA3 (Capcom: the Shoryukens'
    # cancel column is SA3). Damage = an ESTIMATE (5HP + H Shoryuken scaled + SA3 at its 50% minimum and up); the combo
    # lab's / composer's measured routes replace these when they fit
    - {name: "5HP > 623HP > SA3", route: "5HP > 623HP > 236236K", starter: "Standing Heavy Punch", id: 608, startup: 10,
       damage: 4300, super: 30000, on_block: -2,
       seq: "5+HP@3 5@8 6@3 2@3 3+HP@3 2@3 3@3 6@3 2@3 3@3 6+LK@3"}
    - {name: "2HP > 623HP > SA3", route: "2HP > 623HP > 236236K", starter: "Crouching Heavy Punch", id: 630, startup: 9,
       damage: 4300, super: 30000, on_block: -8,
       seq: "2+HP@3 5@8 6@3 2@3 3+HP@3 2@3 3@3 6@3 2@3 3@3 6+LK@3"}
    - {move: sa3, reach: 1.3, on_block: -52}
    - {move: sa1, reach: 4.5, projectile: true, on_block: -24}
  # MEASURED: where each of Ryu's moves connected in the 202 recordings sent so far (90th percentile of the start distance
  # of the starts that connected, minus 0.1); the bot's own measured reach (reach.py, menu B) wins where it is longer
  reach_fallback:
    Standing Light Punch: 1.4
    Crouching Light Punch: 1.2
    Standing Light Kick: 1.6
    Crouching Light Kick: 1.3
    Standing Medium Punch: 1.3
    Crouching Medium Punch: 1.4
    Standing Medium Kick: 1.8
    Crouching Medium Kick: 1.75
    Standing Heavy Punch: 1.8
    Crouching Heavy Punch: 1.35
    Standing Heavy Kick: 1.5
    Crouching Heavy Kick: 2.05
    L Shoryuken: 1.35
    H Tatsumaki Senpu-kyaku: 1.6        # 0.28.0: was 2.4 (later hits); see max_reach above
  pdr_frames: 24       # ESTIMATE: Parry Drive Rush from the parry's first frame to the normal's (parry out on its frame ~10,
                       # the rush, the normal on rush frame ~11: combo_lab.RUSH_AT, a guess)
  pdr_travel: 0.6      # 0.26.0 MEASURED (0.25.0 ranked, 30 rushes): an 18-frame rush closed 0.62; a normal out of it
                       # reaches its own reach + this (the old pdr_reach 2.9 let rush normals whiff from 2.0-2.7)
# 0.37.0 checking an incoming Drive Rush (fighter._rush_check; user: "Excellent buttons to use are standing medium punch,
# and crouching light punch. Do not shoryuken"). The first move whose active frame meets the rusher inside its reach (its
# measured reach, else reach_fallback; `min_dist`: 5MP only when the rusher is still that far when it hits, else 2LP).
# Capcom start-ups; ids = Ryu's catalog.
rush_check:
  enabled: true
  min_closing: 0.015
  vary_dist: 0.12        # 0.41.0: the check meets the rush up to this much closer (drawn per rush): its timing varies
  moves:
    - {name: "Standing Medium Punch", seq: "5+MP@3", startup: 6, id: 605, min_dist: 0.9}
    - {name: "Crouching Light Punch", seq: "2+LP@3", startup: 4, id: 622}
# Opponents without a catalog: ids from the inferred move map (menu X, datasets/move_maps/), only at
# this confidence or better. Capcom's on-block value + margin is used, so -4 on Capcom's page is
# treated as -2 (no punish) and -12 as -10: punishes only where they have room to spare.
inferred:
  min_confidence: medium
  block_adv_margin: 2
# Capcom on-block for catalogued moves without a measured guard-All value (matched by exact move
# name, so only the 1-2F differences between Capcom's page and the meter need a margin; measured
# 0.3.3: 2HP 34 vs 36, 4HP 35 vs 36, 4HK 43 vs 44).
capcom:
  block_adv_margin: 1
# Drive gauge units (exporter `drive`: 60000 = 6 bars). Costs per SF6's rules (community-documented,
# not measured here): Drive Impact 1 bar, Drive Parry 0.5 to start, Drive Rush from a cancel 3 bars,
# OD moves 2 bars, Drive Reversal 2 bars. RULE (user): never spend into burnout unless lethal is certain.
drive_costs:
  drive_impact: 10000
  drive_parry: 5000
  cancel_drive_rush: 30000
  od_move: 20000
  drive_reversal: 20000
drive_reserve: 10000     # 0.20.0 (user's pick: Drive discipline): optional spends keep a bar back; DI-back exempt
# 0.26.0 (user: "it should know that it can drive rush cancel to make some moves that might whiff on followup from long
# range hit up close, and extend into a combo ender. For example, a max range 5HP"). MEASURED 0.25.0 ranked (35
# recordings): a special cancelled from one of the bot's normals that hit, by the distance when it started: H Shoryuken
# hit 78 of 81 within 1.4, 15 of 18 at 1.4-1.6 (the misses from 1.4 on), 2 of 4 beyond; OD Shoryuken 9 of 9 within 1.4;
# M Tatsumaki 29 of 31 within 1.8. 2MK and 5HP carry Ryu forward before they hit (distance at the follow-up's start minus
# at the normal's start, median: 2MK -0.42, 5HP -0.40, 2HP -0.29, Whirlwind Kick -0.54; the others ~0). The combo composer
# leaves a follow-up out when its start would be farther than this; a Drive Rush cancel (it closes the distance) or a
# projectile ender (SA1, Hadoken: no limit) takes its place, or the combo ends on the hit it has.
combo_reach:
  follow:
    L Shoryuken: 1.5
    M Shoryuken: 1.5
    H Shoryuken: 1.5
    OD Shoryuken: 1.4
    SA3 Shin Shoryuken: 1.5
    CA Shin Shoryuken: 1.5
    M Tatsumaki Senpu-kyaku: 1.85
  travel:
    Crouching Medium Kick: 0.42
    Standing Heavy Punch: 0.40
    Crouching Heavy Punch: 0.29
    Whirlwind Kick: 0.54
# System moves share action ids across characters. MEASURED in the user's replays (2026-10-02):
# Ken's Drive Impact 855, parry 480/482, throws 715/720 equal Ryu's catalog ids. Used when the
# opponent has no move catalog, so DI reactions work against any opponent seen so far.
common_moves:
  855: {name: "Drive Impact", di: true}
# Action ids by kind, MEASURED in the user's Ryu vs Ken fights and replays (2026-10-02). "a-b" = range.
ids:
  jump: ["34-40", "650-659"]          # Ken jump 36/37, jump normals 651-655 (Ryu's are 651-656)
  throw_startup: [715, 716, 717]      # Ryu forward 715 / back 716 (catalog); Ken 715 / 717
  thrown: [721, 725]                  # the bot being thrown by Ken's forward / back throw
  hit_reaction: ["200-399"]           # hit, juggle, knockdown and wake-up (2xx/3xx in the fights)
  parry: ["480-489"]                  # Drive Parry (480 start, 482/484 seen after it: Ryu and the ranked opponents)
attack_id_min: 450     # heuristic: opponent action ids >= this are attacks (Ryu: normals 600+, specials 900+, DI 855, parry 480)
# 0.18.6: the user's punishes for specific moves, used whenever that move is blocked or whiffs near the bot, whatever the
# frame data says. Keyed by character; `match` is a regex over Capcom's move name and notes (the bot says at match start
# which moves it matched); `move` is a key in `moves` below. User, 2026-10-04: "Ingrid's teleport, where she goes forward
# and hits you from above the head, is punishable by a light Shoryuken."
punish_overrides:
  Ingrid:
    # 0.25.0: Capcom's name is "Vanishing Sun (Forward)" (the old 'teleport|warp' never matched); answered from its first
    # frame by move_answers below; this stays for a blocked / whiffed one
    - {match: "^Vanishing Sun \\(Forward\\)$", move: punish_l_srk, why: "user: punishable by a light Shoryuken"}
# 0.25.0 respecting the opponent's invincible supers (fighter.op_reversal_super; Capcom notes "invincible" on an SA / CA):
# on its get-up a meaty and a throw lose value while the bar holds one; a THROW super (Akuma's CA Shun Goku Satsu) near the
# bot takes the parry away and favours a jump / back dash at pressure moments. ESTIMATES (thousands of hp).
reversal_respect:
  meaty_penalty: 1.5
  throw_penalty: 1.0
  throw_super_dist: 2.0
  throw_super_jump_bonus: 1.0
  throw_super_back_dash_bonus: 0.6
# 0.25.0 guard hold (fighter._guard_hold): after blocking a hit, keep blocking while that same move is still active (its last
# active frame + margin) - no pressure option, no button. MEASURED (0.24.x ranked): 94 hits after the bot had blocked an
# earlier hit of the same move.
guard_hold:
  enabled: true
  margin: 1
# 0.38.0 the light string (fighter._light_string; user: SF6's rule, up to 3 lights and a special before the turn is over):
# after a blocked light normal, keep blocking `window` frames after the bot is free until `max_lights` have been blocked.
# MEASURED (0.37.x ranked): the next light came within 10 frames in 93% of 141 cases; 30 of the 34 that hit within 9.
# 0.38.0 supers that go through the bot's projectiles (fighter.opponent_fireball_beaters): with the bars for one, no Hadoken
# from neutral and no fireball clash. Cammy SA3 / CA: the user's rule. The others: Capcom notes them invincible to
# projectiles (A.K.I. SA1, E. Honda SA1 / SA2, Akuma's projectile super SA1 Messatsu Gohado).
fireball_respect:
  Cammy: "^(SA3|CA) "
  A.K.I.: "^SA1 "
  E. Honda: "^SA[12] "
  Akuma: "^SA1 Messatsu"
# 0.38.0 ids MEASURED from recordings (fighter.measured_ids): above the inferred move map, below a catalog. Luke (3 ranked
# matches, 0.37.3): the Flash Knuckle's first id (held or not), then the release; contact frames from the press equal
# Capcom's start-ups (L 13 / L Charged 26 / M Charged 29 / H 22 / H Charged 33)
id_names:
  Luke:
    920: {name: "L Flash Knuckle", hold: true}
    921: {name: "L Flash Knuckle", from_parent: 9}
    922: {name: "L Flash Knuckle(Charged)", from_parent: 18}
    924: {name: "M Flash Knuckle", hold: true}
    927: {name: "M Flash Knuckle(Charged)", from_parent: 18}
    929: {name: "H Flash Knuckle", hold: true}
    930: {name: "H Flash Knuckle", from_parent: 13}
    931: {name: "H Flash Knuckle(Charged)", from_parent: 19}
hold_wait:
  enabled: true
  max_dist: 3.2
light_string:
  enabled: true
  window: 10
  max_lights: 3
  max_dist: 2.0
# 0.25.0 the user's answers decided on the move itself, from its first frame (fighter._move_answer, apply_move_answers).
# `do: anti_air`: the `move` (a Shoryuken) is timed so its first active frame lands once the opponent's move is airborne and
# no longer invincible (Capcom's notes), before it hits. `do: drive_impact`: a Drive Impact once the move is past its active
# frames (blocked or whiffed) - its armor takes the follow-up - unless the move came out of `unless_after` and its name
# matches `unless_match`. `max_dist`: no answer beyond it (none = any distance: a teleport).
# User (2026-10-05): "Ingrid's forward teleport, where her legs kick, can be shoryukened"; "Ken's dragonlash must be
# shoryukened"; "Ken's Jinrai kicks can be DI'ed, unless Ken starts with Heavy punch and goes into medium Jinrai".
move_answers:
  Ingrid:
    - {match: "^Vanishing Sun \\(Forward\\)$", do: anti_air, move: punish_l_srk, teleport: true, why: "user: Shoryuken it"}
  # 0.37.0 (user, 2026-10-08): H Dragonlash Kick is Drive Impacted on reaction; the others stay Shoryukened. Jinrai: a
  # Drive Impact on the FOLLOW-UP, only after the first Jinrai Kick was BLOCKED (not whiffed), never after HP > M Jinrai
  # (replaces 0.25.0's Drive Impact once the Jinrai itself was past its active frames)
  Ken:
    - {match: "^H Dragonlash Kick$", do: di_react, max_dist: 2.5, fallback: punish_l_srk, why: "user: DI it on reaction"}
    - {match: "^(L|M|OD) Dragonlash Kick$|^\\[Quick Dash\\] Dragonlash Kick$", do: anti_air, move: punish_l_srk,
       max_dist: 2.0, why: "user: Dragonlash must be Shoryukened"}
    - {match: "^Standing Heavy Kick$", do: di_react, normal: true, max_dist: 2.2, why: "user: DI it on reaction"}
    # the user (2026-10-08): "Ken's jinrai kick follow ups are all perfectly DIable, AS LONG AS HE INITIATES THEM": the
    # trigger is Ken's follow-up press (forward + a kick) during a BLOCKED Jinrai, not the follow-up's start-up
    - {match: "^(L|M|H) Jinrai Kick$", do: di_followup, buttons: [LK, MK, HK],
       never_after: ["^Standing Heavy Punch$", "^M Jinrai Kick$"], why: "user: DI the Jinrai follow-ups he initiates"}
    - {match: "^(OD )?(Kazekama Shin Kick|Gorai Axe Kick|Senka Snap Kick)$", do: di_react, after: "Jinrai Kick$",
       after_blocked: true, never_after: ["^Standing Heavy Punch$", "^M Jinrai Kick$"], max_dist: 2.2,
       why: "user: DI the follow-up after a blocked Jinrai Kick"}
  Ryu:
    - {match: "^H High Blade Kick$", do: di_react, max_dist: 2.5, why: "user: DI it on reaction (not against SA3)"}
  Sagat:
    - {match: "^H Tiger Knee Crush$", do: di_react, max_dist: 2.5, fallback: punish_l_srk, why: "user: DI it on reaction"}
    - {match: "^(L|M|OD) Tiger Knee Crush$", do: anti_air, move: punish_l_srk, why: "user: Shoryuken it on reaction"}
  Mai:
    - {match: "Musasabi no Mai$", do: anti_air, move: punish_l_srk, air: true, why: "user: Shoryuken it on reaction"}
  Ed:
    - {match: "^Cobra Punch$", do: anti_air, move: punish_l_srk, max_dist: 2.0, why: "user: Shoryuken it on reaction"}
  Marisa:
    - {match: "^(L|M|H|OD) Phalanx$", do: di_react, max_dist: 2.5, fallback: punish_l_srk,
       why: "user: DI it on reaction, else Shoryuken"}
  Blanka:
    - {match: "^(\\[Lightning Beast\\] ?)?(L|M|H|OD) Rolling Attack$", do: anti_air, move: punish_l_srk,
       why: "user: Shoryuken the ball"}
  E. Honda:
    - {match: "^(L|M|H) Sumo Headbutt$", do: anti_air, move: punish_l_srk, why: "user: Shoryuken the headbutt"}
  Cammy:
    - {match: "Cannon Strike|Reverse Edge", do: anti_air, move: punish_l_srk, air: true,
       why: "user: Shoryuken Cannon Strike / Reverse Edge"}
    # 0.38.0 (user: "Ryu is not using Shoryuken on Cammy's Hooligan, OD or otherwise"): replaces 0.37.0's no_anti_air.
    # MEASURED (0.37.3, 6 Cammy matches): Fatal Leg Twister landed 14 of 18 Hooligans while the bot stood or walked
    - {match: "^(OD )?Hooligan Combination", do: anti_air_box, move: punish_l_srk, max_dist: 2.8, max_frame: 40,
       why: "user: Shoryuken every Hooligan (the throw out of it needs a standing opponent)"}
  Luke:
    - {match: "Flash Knuckle\\(Charged\\)$", do: di_react, max_dist: 2.5, why: "user: DI it on reaction"}
  Manon:
    - {match: "^Standing Heavy Kick$", do: di_react, normal: true, max_dist: 2.2, why: "user: DI it on reaction"}
  Kimberly:
    - {match: "^(OD )?(Torso Cleaver|Shadow Slide|Neck Hunter)$", do: di_react, max_dist: 2.5,
       why: "user: DI the Sprint follow-ups other than Emergency Stop"}
# 0.37.0 Drive Impact's hitbox, MEASURED from the bot's catalog boxes: only on its frame 26, 1.0-1.8 in front of where the
# bot started (its forward travel included), 0.89-1.41 high. A reaction Drive Impact goes out only when the opponent's
# hurtbox will be inside it then (fighter._hitbox_meets).
drive_impact_hitbox:
  frames:
    - [26, 0.996, 1.796, 0.89, 1.41]
# 0.37.0 answers derived from Capcom's frame data for moves no rule above names (fighter._auto_rules): a Shoryuken against
# specials airborne in their active frames, a Drive Impact against slow specials (at most 2 hits, not projectiles); both
# gated by distance, the opponent's Super for a super cancel, and the bot's Drive. `react`: frames seen before deciding
# (ESTIMATE), `lead`: input delay used for the feasibility check.
move_answers_auto:
  enabled: true
  anti_air: true
  drive_impact: true
  react: 8
  lead: 4
  anti_air_move: punish_l_srk
  di_max_dist: 2.2
moves:
  punish_l_srk: {name: "L Shoryuken (punish)", seq: "6@3 2@3 3+LP@3", startup: 5}
  hadoken_lp: {name: "L Hadoken", seq: "2@3 3@3 6+LP@3"}
  hadoken_hp: {name: "H Hadoken", seq: "2@3 3@3 6+HP@3"}
  hadoken_od: {name: "OD Hadoken", seq: "2@3 3@3 6+LP+MP@3", startup: 12}   # 0.37.0 (Capcom: 2 hits, start-up 12, -1)
  low_forward_fireball: {name: "2MK > 236MP", route: "2MK > 236MP", seq: "2+MK@3 2@6 3@3 6+MP@3"}   # SuperCombo: true blockstring, DI-safe
  light_chain: {name: "2LK ~ 2LP ~ 5LP", route: "2LK ~ 2LP ~ 5LP", seq: "2+LK@3 2@7 2+LP@3 5@7 5+LP@3"}
  standing_hp: {name: "5HP", seq: "5+HP@3"}
  throw: {name: "Throw", seq: "5+LP+LK@3"}
  throw_tech: {name: "Throw tech", seq: "5+LP+LK@3"}
  shoryuken: {name: "Shoryuken (623HP)", seq: "6@3 2@3 3+HP@3"}
  # 0.18.0 anti-air: L Shoryuken (Capcom: start-up 5, active 5-14, air-invincible), crouching HP (start-up 9)
  anti_air_srk: {name: "L Shoryuken (anti-air)", seq: "6@3 2@3 3+LP@3", startup: 5}
  # 0.18.1 Super Arts (Capcom: SA3 Shin Shoryuken 236236K start-up 5, 4000 dmg; SA1 Shinku Hadoken 236236P start-up 7,
  # 2000 dmg); 3-frame motion steps (0.4.1: 2-frame steps turned 236236 into 623)
  sa3: {name: "SA3 Shin Shoryuken", seq: "2@3 3@3 6@3 2@3 3@3 6+LK@3", startup: 5, super: 30000, damage: 4000}
  sa1: {name: "SA1 Shinku Hadoken", seq: "2@3 3@3 6@3 2@3 3@3 6+LP@3", startup: 7, super: 10000, damage: 2000}
  # 0.30.1: SA2 Lv1 (tapped), only offered after the bot's Drive Impact stun (Capcom: start-up 12, 2800; reach an ESTIMATE)
  sa2: {name: "SA2 Shin Hashogeki（Lv1）", seq: "2@3 1@3 4@3 2@3 1@3 4+LP@3", startup: 12, super: 20000, damage: 2800,
        reach: 1.3}
  crumple_srk: {name: "H Shoryuken (crumple)", seq: "6@3 2@3 3+HP@3", startup: 7}
  # a 2MK that HIT, cancelled into a super (performed on the game clock with hit confirm: no hit, no super)
  confirm_sa3: {name: "2MK > SA3", route: "2MK > 236236K", seq: "2+MK@3", super: 30000}
  confirm_sa1: {name: "2MK > SA1", route: "2MK > 236236P", seq: "2+MK@3", super: 10000, damage: 2600}
  drive_impact: {name: "Drive Impact", seq: "5+HP+HK@3"}
  # 0.37.0 (user: "Max range HP into M High Blade is a spacing trap that pushes opponents away effectively"): a neutral 5HP
  # from min_dist or farther is cancelled into M High Blade Kick on hit OR block (combo executor, block_ok); a whiff sends
  # nothing more. 5HP's reach measured 2.0 (neutral cap); min_dist an ESTIMATE of "max range".
  spacing_trap: {name: "5HP > M High Blade Kick (spacing)", route: "5HP > 236MK", seq: "5+HP@3",
                 starter: "Standing Heavy Punch", min_dist: 1.7}
  walk_forward: {name: "walk forward", seq: "6@12"}
neutral:
  far:   {hadoken_lp: 3, hadoken_hp: 2, walk_forward: 3, wait: 2}
  mid:   {walk_forward: 5, low_forward_fireball: 1, wait: 2}
  poke:  {low_forward_fireball: 4, standing_hp: 2, walk_forward: 1, block: 2}
  close: {light_chain: 3, throw: 2, low_forward_fireball: 2, block: 2}
  decision_every_s: 0.35   # one neutral decision every N seconds
  block_s: 0.4             # "block" = hold down-back this long
# 0.16.0 (assess.py): perfect parry projectiles once their arrival time has been learned (each blocked / hit
# projectile is a sample: distance when thrown -> frames to contact); a miss is a normal parry, which against a
# projectile gives the Drive back. Drive Impact punishes moves that leave the opponent busy >= 26F (DI start-up)
# + the input delay, out of the bot's pokes but inside Drive Impact's reach (measured by reach.py, else 3.0).
# 0.17.0 human limits (human_limits.py; `fight --human-limits`, `--blind`, panel "Human limits"): reactive rules wait
# for a sampled human reaction time; button holds vary. ESTIMATES (reaction literature), not measured on SF6 players.
# A disclosed setting: every match summary, the thoughts and progress.md record it.
human_limits:
  enabled: false
  reaction: {median: 16, sigma: 0.18, floor: 11}      # game frames
  per_kind:
    guard: {median: 21, sigma: 0.2, floor: 14}        # switching block height for an overhead / low
    anti_air: {median: 15, sigma: 0.2, floor: 10}
  hold_jitter: 1
perfect_parry:
  enabled: true
  min_dist: 1.2            # closer, a projectile arrives too soon to time; block instead
  seq: "5+MP+MK@12"
# 0.22.4 (user: "when it is in burnout, it cannot just sit there and block Hadoukens. Otherwise, it will just die from chip
# damage"): in burnout (Drive reached 0, until the gauge is full again) an opponent fireball is cancelled with the bot's own
# H Hadoken when there is time for it to come out, else jumped (forward within jump_fwd_max, else neutral), else blocked.
burnout:
  enabled: true
  full_drive: 59000          # burnout ends when the gauge is (nearly) full again
  clash_move: hadoken_hp
  hadoken_startup: 16        # Capcom (Ryu's Hadokens)
  jump_fwd_max: 3.4          # ESTIMATE: a forward jump over the fireball lands on the thrower from about this far
  # MEASURED (Ryu's Hadokens in the 0.18.10-0.22.1 ranked recordings, medians): frames from the throw's start to the
  # fireball reaching the opponent ~ 27 at 2.75 apart, +10 per unit farther (16 at 1.0, 47 at 4.25); used until this
  # match has learned the projectile's own arrival times
  fireball_frames_at: 27
  fireball_ref_dist: 2.75
  fireball_frames_per_unit: 10
  fireball_min_frames: 14
# 0.23.0 fireball play (sf6bot/zoning.py; replaces the burnout rule above and 0.16.0's perfect parry rule). MEASURED 0.22.5:
# against a fireball Ryu (0-4) the bot held down-back through 87-93% of the Hadoken animations, drifted 17-25 units back a
# match, spent 227 s in burnout over 6 Ryu matches and lost 7 of 8 rounds on time. From the throw's first frame: jump over
# it onto the thrower / SA1 through it when the frames say it lands, else walk in while it is far and meet it with a timed
# parry (a block when low on Drive); in burnout cancel it or jump it. Values in thousands of hp are ESTIMATES (priors);
# what each answer scores against the opponent takes over (situation "fireball", datasets/learning).
fireball:
  enabled: true
  # 0.24.2 (user, 2026-10-05: "there's no reason to initiate any attack with a jumping attack. Unless it is a DI stun in the
  # corner"): the forward jump-in onto the thrower is off. The neutral jump over a fireball (no attack) stays.
  # 0.28.0 (user, 2026-10-06: "Jump with a jump-in combo"): on again for this case. MEASURED (the user's Akuma, 4 matches
  # zoned from 2.4-2.8 with L Gou Hadoken every 46-52 frames): the bot dealt 0 in two matches, its only way in was walking.
  # Decided on the throw's lead-in (lead_ins below / learned in the match) so the jump attack lands before the thrower
  # recovers; the combo lab's TRUE jump-in routes (midscreen ones too), hit-confirmed.
  jump_punish: true
  # lead-in id -> {proj: the projectile id it turns into, len: its fixed length in frames}. MEASURED (the user's Akuma,
  # 2026-10-06): L Gou Hadoken 900 for 8 frames, then 906 (every one of 93). Others are learned in the match.
  lead_ins:
    Akuma:
      900: {proj: 906, len: 8}
  # the jump-in over a fireball, on the game clock (the combo lab's executor: the air button on the way down, the landing
  # combo only after it hit); the combo lab's TRUE jump-in routes come first. damage: Capcom's listed damage of the three
  # moves, an ESTIMATE of the scaled total
  jump_routes:
    - {name: "fireball jump: j.HK , 5HP > 623HP", route: "j.HK , 5HP > 623HP", seq: "9@3", damage: 2700}
  jump_attack: "5+HK@3"     # without a planned route (no Capcom data): j.HK on the way down, below this height
  air_attack_y: 0.9
  jump_land_min: 0.2        # ESTIMATE: the forward jump (1.9, MEASURED) must land this close to the thrower ...
  jump_land_max: 0.7        # 0.32.0 (was 0.9): landing 0.8+ from the thrower, the jump attack (pressed ~0.25 before the
                            # landing) whiffed at 1.0-1.2 (MEASURED 0.28-0.31: 13 whiffs of 20 jump-ins)
  jump_free_margin: 4       # 0.32.0: frames to spare before the thrower is free (MEASURED: take-off 8 frames after the
                            # decision, not the 4 predicted)
  jump_free_margin_lead_in: 2  # 0.32.0: decided on the throw's lead-in (Akuma's Gou Hadoken, seen 8 frames earlier;
                               # MEASURED 0.28.0 open loop: ~3 frames to spare): a smaller margin
  jump_punish_value: 0.8    # share of the route's damage expected
  jump_fail_cost: 0.3
  sa1: false                # 0.25.0: SA1 through a projectile is off (MEASURED 0.24.x ranked: 5 tries, 5 whiffed and punished)
  sa1_value: 0.85           # ASSUMPTION: the Shinku Hadoken beats a normal projectile
  super_bar_cost: 0.4
  clash_move: hadoken_hp
  clash_startup: 12         # Capcom: H Hadoken
  clash_min_dist: 2.5
  clash_min_frames_per_unit: 11.0   # 0.25.0: no clash against a faster projectile (Akuma's charged Gou Hadoken ~9.6)
  clash_margin: 5           # 0.25.0: the bot's Hadoken must be out this many frames before the projectile arrives (was 2)
  charge_block: true        # 0.25.0: block while the opponent holds a projectile's charge (move_timing lead-in)
  charge_block_dist: 4.5
  clash_value: -0.05        # outside burnout walking in and parrying gains ground and keeps the Drive
  clash_od_margin: 8        # 0.38.0: frames to spare (was clash_margin 5): 4 of 10 into Akuma's Gou Hadokens were hit
  clash_od_reserve: 30000   # 0.38.0: Drive left after it (was drive_reserve 10000): the OD Hadokens drove Akuma matches into burnout
  clash_od_value: 0.5       # 0.37.0 (user: "OD Hadoken beats any projectile that only has one hit"): ESTIMATE, learned per opponent
  clash_value_burnout: 0.3
  jump_over_value: -0.1
  jump_over_value_burnout: 0.25
  neutral_jump_min_tau: 8   # a neutral jump over it: the projectile passes at least this many frames into the jump
  act_floor: 0.0
  parry_min_drive: 10000    # a parried projectile gives the Drive back; one bar kept for a parry that misses
  parry_min_dist: 2.5       # 0.31.1: block, not parry, with the thrower nearer (MEASURED: thrown out of the parry 24-30%)
  # 0.37.0: timed from the projectile's own hitbox (exporter v11; the contact frame within 1 frame 70% of the time,
  # MEASURED) the parry is a perfect parry: parried nearer the thrower, tapped short. ESTIMATES.
  parry_min_dist_box: 1.5
  parry_early_box: 1
  parry_hold_box: 8
  block_pad: 6              # block from this many frames (+ input delay) before it arrives
  walk_stop: 0              # extra frames kept between the last walking line and the parry / block
  walk_min_dist: 1.6
# 0.20.7 (user, 2026-10-05: "It's using DI in fucking neutral. This is a travesty."): off. The bot's own Drive Impact
# is now only the DI-back (the opponent's DI) and DI inside combo routes.
di_punish:
  enabled: false
# 0.14.0: defence at pressure moments by PREDICTION (sf6bot/defense.py). Throws can't be teched on reaction:
# a 5-frame start-up vs seeing it + 3-5 frames of input delay (26 of 29 throws landed in the user's FT5).
# When the bot is about to be free (blockstun / knockdown ending) with the opponent this close, it commits
# to one option so it reaches the game on the first free frame, drawn from what this opponent did before.
defense:
  max_dist: 1.4            # opponent within this (game units; throw range ~0.8 + a step) = a pressure moment
  back_throw_wall: 2.5     # 0.25.0: tech / throw options throw backwards only with the bot's back this close to its wall
  approach: true           # 0.18.0: the opponent walking in to within approach_dist in neutral is a moment too
  approach_dist: 1.15
  approach_reset: 1.6      # a new approach once the opponent was this far away again
  # 0.18.4: against an opponent with a ground command grab (Capcom "Throw" property on a special / super), walking in
  # is a moment from farther out. ESTIMATES: command grab ranges are not in Capcom's data or measured yet.
  approach_dist_cmd_grab: 1.6
  approach_reset_cmd_grab: 2.0
  watch_frames: 30         # nothing within this many frames after it = the opponent "waited"
  # MEASURED (0.17.5, 13 recordings: Ryu, Ken, Akuma, Jamie, Viper): the last get-up action lasts 30 frames, then the
  # player is free (the exported action length says 42-50: the animation). Only these ids are wake-up moments.
  wakeup_frames: {340: 30, 341: 30, 342: 30, 344: 30, 345: 30}
  temperature: 0.35        # lower = lean harder on the best-looking option (still a mix)
  model_weight: 4          # tries of an option before its own measured result outweighs the payoff table
  # starting odds of the opponent's answer (counts are added per opponent, learning.Experience)
  # cmd_grab counts only against opponents that have a ground command grab (0.18.4)
  prior: {throw: 1.5, strike: 1.5, shimmy: 0.5, wait: 1.5, cmd_grab: 1.0}
  # 0.27.0 per situation, MEASURED (0.26.0 ranked, 33 Diamond matches; the opponent within 1.4, its next action): after
  # a block strike 330 / throw 18 / shimmy 11 / wait 2; after a hit 158 / 10 / 2 / 1; on the bot's wake-up 70 / 9 / 12
  # / 6; walking in close 50 / 36 / 4 / 30. Same total weight as `prior` (5), so each opponent's own answers still take
  # over. The bot's tech guess after a block averaged -540 hp there (53 tries, hit 45 times), a reversal +1,250
  prior_by_situation:
    after_block:      {strike: 4.55, throw: 0.25, shimmy: 0.15, wait: 0.05, cmd_grab: 1.0}
    after_rush_block: {strike: 4.55, throw: 0.25, shimmy: 0.15, wait: 0.05, cmd_grab: 1.0}
    after_hit:        {strike: 4.6, throw: 0.3, shimmy: 0.06, wait: 0.04, cmd_grab: 1.0}
    wakeup:           {strike: 3.6, throw: 0.45, shimmy: 0.6, wait: 0.35, cmd_grab: 1.0}
    approach:         {strike: 2.1, throw: 1.5, shimmy: 0.15, wait: 1.25, cmd_grab: 1.0}
  options:
    block:      {seq: "1@12"}
    # 0.25.0: the throw's direction is set when the option goes out (fighter.throw_direction): forward, back only with the
    # bot's own back within back_throw_wall of its wall (MEASURED 0.24.x: 148 back throws with nothing to tech)
    # 0.31.1: both tech GUESSES off. MEASURED (ranked 0.26.0-0.31.0, the next 90 frames): a throw pressed after a block
    # with no throw coming averaged -555 hp (86), on wake-up -378 (47); it met a throw 5 times. Held block with a throw
    # coming -152 (19), and techs on REACTION (rules 2 / 00: the start-up or the thrown state) -22 / -44 (24): those
    # tech 90% of normal throws. So the bot blocks and techs what it sees.
    delay_tech: {seq: "1@4 4+LP+LK@3 1@8", enabled: false}     # hold down-back, then throw
    tech:       {seq: "4+LP+LK@3 1@8", enabled: false}
    jab:        {seq: "2+LP@3 1@6"}
    back_dash:  {seq: "4@3 5@2 4@3"}
    jump:       {seq: "8@4"}
    # 0.18.3: an INVINCIBLE reversal the bot can afford, first that fits (Capcom notes, Ryu): SA3 "completely invincible
    # 1-16", OD Shoryuken "completely invincible 1-8", SA1 "invincible to strikes and throws 1-8". Not H Shoryuken:
    # "invincible against mid-air ... strikes" only (0.18.1 ranked: 55 tries, -300 to -700 hp each). None affordable =
    # no reversal option at that moment.
    reversal:
      pick:
        - {name: "SA3", seq: "2@3 3@3 6@3 2@3 3@3 6+LK@3", super: 30000, lethal_only: true, damage: 4000}
        - {name: "OD Shoryuken", seq: "6@3 2@3 3+LP+MP@3", drive: od_move}
        - {name: "SA1", seq: "2@3 3@3 6@3 2@3 3@3 6+LP@3", super: 10000}
        - {name: "SA3", seq: "2@3 3@3 6@3 2@3 3@3 6+LK@3", super: 30000}
    # 0.40.0: off. MEASURED (0.38.2 / 0.39.0 ranked, 59 matches): 37 of the bot's parries had nothing to parry, 13 of them
    # ended in a throw (a punish counter, 2,040 each); opponents walked up and threw the held parry. Like the tech guesses
    # (0.31.2): at pressure moments the bot blocks and answers what it sees
    parry:      {seq: "5+MP+MK@14", drive: drive_parry, enabled: false}
    # 0.20.0 (user's pick): Drive Reversal, 6+HP+HK while blocking (Classic), 2 Drive bars; Capcom's notes allow it only
    # during guard or a knockdown, so it is input `early` frames before the stun ends (it must come out IN the stun)
    drive_reversal: {seq: "6+HP+HK@3", early: 8, drive: drive_reversal,
                     situations: [after_block, after_rush_block, wakeup]}
  # ESTIMATES from game knowledge (NOT measured), thousands of hp for the bot when the opponent answers with
  # each option. What each option actually scores against an opponent replaces these as tries accumulate.
  payoff:
    block:      {throw: -1.2, strike: 0.0, shimmy: 0.0, wait: 0.0, cmd_grab: -2.5}
    # 0.25.0 MEASURED (61 ranked matches on 0.24.x): the tech options' throw was hit 66 times, 38 in its start-up by a strike
    # and 28 after it whiffed (a shimmy); lowered from strike -0.2 / -0.9
    delay_tech: {throw: 0.0, strike: -0.7, shimmy: -1.8, wait: -0.3, cmd_grab: -2.5}
    tech:       {throw: 0.0, strike: -1.3, shimmy: -1.8, wait: -0.3, cmd_grab: -2.5}
    jab:        {throw: 0.3, strike: -0.9, shimmy: -0.6, wait: 0.2, cmd_grab: 0.3}
    back_dash:  {throw: 0.0, strike: -1.0, shimmy: -0.2, wait: 0.0, cmd_grab: 0.3}
    # 0.19.0 MEASURED (22 ranked matches): jumps out of blockstun lost 390-730 hp each over the next 2.3 s (lowered from
    # throw 0.6, strike -1.2, shimmy -0.4, wait -0.3); still the answer to a command grab
    jump:       {throw: 0.3, strike: -2.0, shimmy: -1.0, wait: -0.6, cmd_grab: 1.5}
    # 0.21.0 (user: "parries and reversal guesses rare"; 7 ranked matches on 0.20.5 / 0.20.6: SA1 8 times, reversal
    # guesses blocked, ~2.3 parries a minute, 3 burnouts): the guesses are worth less before this opponent's own
    # answers say otherwise (was reversal 1.2 / 1.2 / -2.5 / -2.5, parry -1.5 / 0.6 / -0.4 / -0.2, Drive Reversal
    # 0.0 / 0.1 / -0.3 / -1.0). With the prior odds: delay tech ~57% after a block, a guess ~15% together
    reversal:   {throw: 0.8, strike: 0.8, shimmy: -2.5, wait: -3.0, cmd_grab: 1.2}   # a blocked Shoryuken is a full punish
    parry:      {throw: -1.5, strike: 0.1, shimmy: -0.4, wait: -0.5, cmd_grab: -3.0}
    # invincible, pushes away (little damage) but costs 2 of the 6 Drive bars; blocked it is punishable, so "wait" (the
    # opponent blocks) is bad. A minority option: a replay of the 0.19.0 session through decide() picked it at 102 of
    # ~550 moments with the first estimates (0.3 / 0.4 / 0.1)
    drive_reversal: {throw: -0.3, strike: -0.1, shimmy: -0.6, wait: -1.8, cmd_grab: 0.0}
  # 0.21.0 turn-taking by frame data (fighter._turn): whose turn it is decides which options a moment may use.
  #  - the bot minus (or the frames unknown) after a block, a hit, or on its own wake-up: no jab, no instant tech; the
  #    delay tech gets `bonus`; parry / Drive Reversal / reversal / jump lose `guess_penalty`
  #  - the bot plus: the jab gets `jab_bonus`
  #  - the opponent walking in: no block, parry or reversal guess; the jab gets `jab_bonus`
  #  - a parry needs `parry_min_drive`
  #  - on the opponent's wake-up: the meaty only within its measured reach (`meaty_id`, else `meaty_max_dist`), the throw
  #    only within `oki_throw_max`
  # ESTIMATES.
  turns:
    enabled: true
    bonus: 0.2               # 0.27.0: was 0.5 (Diamond opponents strike after a block 92% of the time: block > tech)
    jab_bonus: 0.35
    no_retreat_wall: 2.0     # 0.27.0: no back dash / shimmy option with the bot's back this close to its wall
    guess_penalty: 0.3       # parry / Drive Reversal / reversal / jump on the opponent's turn
    parry_min_drive: 30000
  # 0.23.0 the reactive reversal (fighter._reactive_reversal): with a reversal affordable at a wake-up / after-block / after-hit
  # moment, its motion goes in during the stun and the button only if a strike, throw or command grab of the opponent is on
  # screen on the last line it can still land on the first free frame (else the game above without the reversal). MEASURED
  # 0.22.5: reversals on wake-up +1,183 hp each over 1.5 s (12, one lost), delay tech -306, block -303.
  # 0.38.0: no reversal GUESS in the defence game (blocked OD Shoryukens / SA1s, all into no strike); reactive only
  reversal_guess: false
  reactive_reversal:
    enabled: true
    after_block_min_drive: 30000   # after a block (no knockdown) the OD Shoryuken only with 3+ Drive bars (meter: any)
                                   # 0.27.0: was 4 bars. MEASURED (0.26.0 ranked): reversals after a block +1,250 hp
                                   # each (12), on wake-up +1,740 (10); the OD Shoryuken costs 2 bars, 1 stays
    give_up_after: 3               # stop against this opponent after this many tries averaging below give_up_below
    give_up_below: -0.5            # (thousands of hp: its meaties recover in time, safe jumps)
    hold_direction: 3              # held between the motion and the button (the motion's last direction)
    unknown_max_age: 15            # 0.26.0: an opponent move with no known active frames counts as a strike only
                                   # this many frames after it started (MEASURED 0.25.0: the blocked OD
                                   # Shoryukens answered follow-through ids out 15-19 frames with no contact)
    meaty_id: 640            # Ryu 2MK
    meaty_max_dist: 1.25     # MEASURED 0.14.0: Ryu 2MK connected from up to 1.25 (7 contacts)
    oki_throw_max: 0.9
  # 0.18.3: the opponent getting up next to the bot is the bot's OFFENCE (oki), not a defence: its own options, timed to
  # the opponent's first free frame (the 30-frame get-up, MEASURED). `early`: the decisive input lands that many frames
  # before it, so a meaty's active frames cover it (2MK start-up 8, active 8-10: Capcom). Payoffs are ESTIMATES (thousands
  # of hp); the opponent's answers here and each option's measured result take over as they accumulate.
  # (0.18.1 ranked: on their own wake-up opponents struck 11 times and threw 10 times; the bot answered with H Shoryuken.)
  offense:
    situations: [their_wakeup]
    options:
      meaty:  {seq: "2+MK@3", early: 7}
      throw:  {seq: "5+LP+LK@3", early: 3}
      shimmy: {seq: "4@14"}
      block:  {seq: "1@12"}
    payoff:
      meaty:  {throw: 1.0, strike: 0.2, shimmy: 0.0, wait: 0.4, cmd_grab: 1.0}
      throw:  {throw: 0.0, strike: -0.8, shimmy: -0.6, wait: 1.2, cmd_grab: -0.5}
      shimmy: {throw: 1.5, strike: -0.2, shimmy: 0.0, wait: -0.1, cmd_grab: 1.5}
      block:  {throw: -1.2, strike: 0.5, shimmy: 0.0, wait: 0.0, cmd_grab: -2.5}
  # 0.18.5: after blocking a normal out of a Drive Rush (+4: the opponent is plus) pressing a button is a counter-hit risk
  # (frame trap); blocking is safer. Changes on top of the payoff table, this situation only. ESTIMATES.
  situation_payoff:
    after_rush_block:
      jab:        {strike: -1.6}
      tech:       {strike: -1.6}
      delay_tech: {strike: -0.6}
      block:      {strike: 0.2}
  # 0.18.5: the bot's own Drive Rush normal was blocked and leaves it plus (on-block + 4): its pressure. frame_trap = the
  # first of these normals active before the opponent's 4-frame jab (start-up <= the bot's advantage + 3: Capcom
  # start-ups, Ryu), so a button press from the opponent becomes a counter hit. Payoffs are ESTIMATES.
  rush_pressure:
    situations: [own_rush_block]
    options:
      frame_trap:
        pick:
          - {name: "5HP", seq: "5+HP@3", startup: 10}
          - {name: "2MK", seq: "2+MK@3", startup: 8}
          - {name: "2MP", seq: "2+MP@3", startup: 6}
          - {name: "5MP", seq: "5+MP@3", startup: 6}
          - {name: "2LP", seq: "2+LP@3", startup: 4}
      throw:  {seq: "5+LP+LK@3"}
      shimmy: {seq: "4@14"}
      block:  {seq: "1@12"}
    payoff:
      frame_trap: {throw: 0.8, strike: 1.2, shimmy: 0.0, wait: -0.1, cmd_grab: 0.8}
      throw:      {throw: 0.0, strike: -0.8, shimmy: -0.6, wait: 1.2, cmd_grab: -0.5}
      shimmy:     {throw: 1.5, strike: -0.3, shimmy: 0.0, wait: -0.1, cmd_grab: 1.5}
      block:      {throw: -1.2, strike: 0.1, shimmy: 0.0, wait: -0.2, cmd_grab: -2.5}
  # 0.20.0 (user's pick "corner pressure"): the opponent cornered in blockstun from the bot's move, the bot not minus
  # (its recovery ends no later than the opponent's stun): the same game as rush pressure, timed to the opponent's
  # first free frame. Payoffs are ESTIMATES (a cornered opponent can't back off far, so the shimmy pays a little less).
  corner_pressure:
    enabled: true
    max_dist: 1.3
    max_back: 1.5          # the opponent's back this close to its wall
    situations: [corner]
    options:
      frame_trap:
        pick:
          - {name: "2MK", seq: "2+MK@3", startup: 8}
          - {name: "5MP", seq: "5+MP@3", startup: 6}
          - {name: "2MP", seq: "2+MP@3", startup: 6}
          - {name: "2LP", seq: "2+LP@3", startup: 4}
      throw:  {seq: "5+LP+LK@3"}
      shimmy: {seq: "4@12"}
      block:  {seq: "1@12"}
    payoff:
      frame_trap: {throw: 0.8, strike: 0.6, shimmy: 0.0, wait: -0.1, cmd_grab: 0.8}
      throw:      {throw: 0.0, strike: -0.8, shimmy: -0.4, wait: 1.3, cmd_grab: -0.5}
      shimmy:     {throw: 1.3, strike: -0.4, shimmy: 0.0, wait: -0.2, cmd_grab: 1.3}
      block:      {throw: -1.2, strike: 0.1, shimmy: 0.0, wait: -0.3, cmd_grab: -2.5}
# 0.20.0 (user's pick "Drive Rush approach"): from mid range now and then a Parry Drive Rush (the combo lab's verified
# PDR input) into a normal or a throw. ESTIMATES: the range, the chance, the press frame of the normal in the rush (the
# combo lab's RUSH_AT is a guess too). A blocked rushed normal is +4: the bot's own rush pressure takes over from there.
drive_rush_in:
  enabled: true
  min_dist: 1.8
  max_dist: 3.0
  min_drive: 30000         # 3 bars: the rush's bar + the reserve + one for the follow-up
  chance: 0.08             # per roll
  roll_every_s: 0.5
  cooldown_s: 5.0
  options:
    # 0.20.5: with Capcom data the normals run on the game clock like the combo lab's PDR (parry held, dash once the
    # parry is out, the normal on the rush's frame); `seq` is the wall-clock fallback.
    # 0.21.0: `follow` = the Capcom name of the move out of the rush. With a style table (style.py) the neutral policy
    # rushes where those players rushed and picks the follow-up by what they pressed out of their rushes (12 Legend Ryu
    # replays, 71 rushes: 5HP 10, 5LP 10, 2HP 8, 5HK 8, 2LK 7, 5MP 5, 2MP 3, throw 3, 5MK 2, 2MK 1); `weight` is for
    # this rule's own rolls (no style table)
    - {name: "Drive Rush 5MP", route: "PDR 5MP", follow: "Standing Medium Punch", weight: 0.3,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 5+MP@3"}
    - {name: "Drive Rush 2MK", route: "PDR 2MK", follow: "Crouching Medium Kick", weight: 0.15,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 2+MK@3"}
    - {name: "Drive Rush 5HP", route: "PDR 5HP", follow: "Standing Heavy Punch", weight: 0.1,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 5+HP@3"}
    - {name: "Drive Rush 5LP", route: "PDR 5LP", follow: "Standing Light Punch", weight: 0.1,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 5+LP@3"}
    - {name: "Drive Rush 2HP", route: "PDR 2HP", follow: "Crouching Heavy Punch", weight: 0.05,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 2+HP@3"}
    # 0.26.0 (user: "drive rush into 5HK is an awful option. It keeps whiffing"): removed. MEASURED 0.25.0 ranked: out of a
    # Parry Drive Rush, 5HK hit 1 of 9 (6 whiffed, 2 blocked). After a Drive Rush CANCEL from a 5HP that hit, combos
    # still use 5HK (4 of 4 hit).
    - {name: "Drive Rush 2LK", route: "PDR 2LK", follow: "Crouching Light Kick", weight: 0.05,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 2+LK@3"}
    - {name: "Drive Rush 2MP", route: "PDR 2MP", follow: "Crouching Medium Punch", weight: 0.05,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@8 2+MP@3"}
    - {name: "Drive Rush throw", follow: "throw", weight: 0.15,
       seq: "5+MP+MK@8 6+MP+MK@3 5+MP+MK@2 6+MP+MK@3 6@10 5+LP+LK@3"}
# 0.18.4: a ground command grab that whiffed under the airborne bot: a jump attack on the way down (j.HK), then the
# landing is a whiff punish. Payoffs for "cmd_grab" (above) are ESTIMATES: a neutral jump / back dash / invincible
# reversal beats a command grab, a block / tech never does, and a grabbed parry is a punish counter.
# 0.33.1 (user, 2026-10-07: "whenever the bot would jump against a command throw ... start an air attack and then go into
# any of its heavy punch routes ... while coming down when it would hit the opponent"): j.HP, pressed so it hits
# JUMP_DEPTH frames before landing (the combo lab's jump-in timing), then the composer's best heavy punch combo
# (`jump_attack_name`); without Capcom data / a composer, the j.HP alone with the same timing.
cmd_grab:
  jump_attack: "5+HP@3"
  jump_attack_name: "Jumping Heavy Punch"
  max_dist: 1.6
  # 0.22.6 (user: "It absolutely refuses to jump before the moment of contact"): a command grab that takes long enough to
  # see coming (grabs.py: learned from being grabbed, seeded below) is jumped so the bot is in the air when it would
  # connect: the jump goes in when it would connect within prejump + input delay + stale + jump_margin frames; before
  # that the bot starts nothing (a move still running at that moment would get it grabbed). A running grab's connect is
  # also predicted from how fast it closes in (it connects from `reach`).
  react: true
  jump_seq: "8@4"
  prejump: 4             # Ryu's jump leaves the ground after 4 frames (SuperCombo: 4+38+3)
  jump_margin: 10        # jump this much earlier than the latest moment: in the air ~10 frames before, and ~28 after
  reach: 0.86            # MEASURED: every Siberian Express connected from 0.86 apart (27 grabs)
  run_speed_min: 0.04    # closing faster than this (units a frame) = running in (Siberian Express: 0.086-0.099)
  fixed_spread: 6        # connect frames varying this little = a fixed start-up (Siberian Express close: 24-28)
  # Capcom's start-up of a named grab is used without a measured one only if it is 20+ (slow) or the opponent is within
  # near_dist (a 10-frame grab can't come from 3 apart: the far Siberian Express was named "Russian Suplex" from its inputs)
  near_dist: 1.5
  slow_startup: 20
  # MEASURED (0.22.5 ranked, 7 Zangief matches; grabs.GrabWatch over the recordings): start id -> frames from its start to
  # the grab connecting, frames it lasted when it whiffed, the connecting ids. Siberian Express close 917 (Capcom 28),
  # far 918 (Capcom 55 "at the shortest distance"; ~30 frames of wind-up, then a run), OD 923 / 924 (Capcom 23 / 54),
  # Screw Piledriver 930 (5: no time to react, the defence game's prediction answers it). datasets/grabs/<Character>.json
  # adds what each match learns.
  measured:
    Zangief:
      917: {contact: [24, 28, 28, 28, 28, 28], connect: [919, 921, 926]}
      918: {contact: [52, 57, 58, 58, 60, 64, 64, 66], whiff: [110], connect: [919, 921, 926]}
      923: {contact: [23], connect: [926], variant: true}       # the OD versions show 917 / 918 for a frame first
      924: {contact: [63], whiff: [108], connect: [926, 928], variant: true}
      930: {contact: [5, 5, 5, 5], connect: [931]}
    # 0.28.0, MEASURED (the user's Akuma, 2026-10-06, 9 matches): Ashura Senku (forward) 1075 -> 1076 -> Oboro Throw 1087
    # -> 1088 (bot 1089); 22 of 23 teleports went into the grab. Oboro alone (8 frames) can't be reacted to; from the
    # teleport's first frame it is 29-36.
    Akuma:
      1075: {contact: [29, 32, 33, 34, 36], connect: [1088, 1091]}
      1076: {contact: [18, 21, 22, 23, 25, 25, 28, 29], connect: [1088, 1091]}
      1087: {contact: [8, 8, 8, 8, 8], connect: [1088, 1091]}
    # JP's Embrace (2 matches, 0.22.5; 10 connects): a ranged grab started from 3.0-4.9 apart, connecting 41-49 frames
    # later (the bot shows 1015 / 1025 while caught, then 231); a whiffed one lasts 52 frames. OD 1016 (shows 1010 for a frame).
    JP:
      1010: {contact: [42, 45, 46, 48], whiff: [52, 52], connect: [1011, 1017]}
      1016: {contact: [41, 49], connect: [1017], variant: true}
# 0.19.0: the opponent holding Drive Parry within throw range -> throw (a throw beats a parry). MEASURED, 22 ranked
# matches: 21 parries within 1.2, ~34 frames long on average; the bot threw 2 of them.
parry_throw:
  enabled: true
  max_dist: 1.0            # throw range 0.8 (SuperCombo) + the gap between the players' positions (estimate)
# 0.20.0 (user, 2026-10-05): no Drive Impact of the bot's own while the opponent has Super meter (a super beats it on
# reaction); the DI-back answer to the opponent's Drive Impact always, unless losing that exchange would kill (the DI's
# hit + the opponent's best follow-up with its meter now: assess.threat; ESTIMATES di_hit / follow_up_default). In
# burnout with the wall this close behind, a Super Art (cheapest affordable) against the opponent's Drive Impact.
# 0.39.0 (user: "the instant DI reaction is ... far too much of a tell ... It needs to be on the level of a real human's
# reaction to visually confirming the DI"): the DI-back reaches the game on a frame drawn from min..max of the opponent's
# Drive Impact (frame 1 = its first frame), as a person seeing it and pressing. Capcom: DI hits on its frame 26, armor
# frames 1-27, so the bot's DI must be out by frame 26 and start on frame 3 or later to win; the bot keeps 4 frames of
# margin (input-delay jitter, a DI first seen a line late): safe_max 22 is the most it allows, min is at least 4 (the
# old instant reaction). min / max are ESTIMATES of a human's reaction to a DI (~0.25-0.35 s); `fight --di-delay`, the
# panel's "DI reaction" box, or off.
di_reaction: {enabled: true, min: 15, max: 21, safe_max: 22, buffer_max: 25}   # 0.41.0 buffer_max: the latest free frame a DI-back out of blockstun is tried on
di_rules:
  opp_super_min: 10000
  di_hit: 1000
  follow_up_default: 2000
  splat_wall_dist: 2.0   # 0.41.0: back this close to the wall, a blocked DI wall-splats: the lethal skip does not apply
  wall_dist: 2.0   # 0.32.0 (was 1.5): Ken's Drive Impacts stunned the burned-out bot with its back 1.71 from the wall
  # 0.33.0 (user, 2026-10-07): in burnout (no DI-back), no Super Art for the wall rule, and FREE (not in blockstun): a
  # neutral jump on reading the Drive Impact, while it can still leave the ground (prejump) and rise `clear` frames before
  # the DI's first active frame (Capcom start-up 26). prejump / clear are ESTIMATES (MEASURED jump: 5 frames to leave
  # the ground; ~1.1 high after 6 airborne frames)
  burnout_jump: {enabled: true, seq: "8@3", startup: 26, prejump: 5, clear: 6,
                 # 0.33.2 (user): too late to jump -> L Shoryuken timed so it is on its own frame frame_target (Capcom:
                 # airborne 7-34) when the DI is active (26-27); frame_min / frame_max / frame_target are ESTIMATES
                 srk: {enabled: true, move: punish_l_srk, frame_min: 12, frame_max: 24, frame_target: 16}}
# 0.33.0 (user, 2026-10-07: "a jump in really is just the same combo as a ground combo with just a jumping attack added"):
# the jump-ins the bot chooses (over a fireball; after a Drive Impact stun in the corner) are also composed as a jump
# attack + the composer's best ground combo from the same button; the book's verified jump-in routes compete with them.
# hit_rate: the chance the jump attack connects (an ESTIMATE; it scales the composed route's value). Any jump attack of the
# bot's that hits a grounded opponent is continued the same way (rule 0c').
jump_in:
  enabled: true
  attacks: ["Jumping Heavy Punch", "Jumping Heavy Kick"]
  hit_rate: 0.6
# 0.20.3 (user, 2026-10-05: "It probably should be trying to use Denjin charge when safe ... It shouldn't always give up oki
# for Denjin"). Capcom: Denjin Charge (22+P) is 52 frames, the stock is added on frame 51, one stock at most; it powers up
# Hadoken, Hashogeki, SA1 and SA2. The stock is tracked from the bot's own action ids (catalog C; else these MEASURED Ryu
# ids) and assumed lost at a round's end (not known). Charged (a) while the opponent is down long enough (MEASURED
# knockdown lengths from the first grounded frame, 58 ranked matches: p10 per id), instead of oki only `oki_share` of the
# time when oki is in reach; (b) far apart with the opponent not coming in, as a mix. The rest are ESTIMATES. While a stock
# is held the combo lab's Denjin routes are used.
denjin:
  enabled: true
  seq: "2@3 5@2 2+LP@3"
  total: 52
  stock_frame: 51
  charge_id: 1051
  consume_ids: ["900-911", "1036-1045", "1200-1205", "1212-1219"]
  consume_names: "Hadoken|Hashogeki"
  knockdown_frames: {330: 35, 331: 45, 320: 43, 321: 43, 337: 42, default: 35}
  far_dist: 2.5            # from this far the opponent can't reach the last frames of the charge in time
  far_exposure: 15
  oki_share: 0.4           # charge instead of walking in for oki this often when oki is in reach
  far_share: 0.9           # ... and this often when it isn't
  # 0.23.0: from 3.5 (was 3.0: 7 of 26 range charges in the 0.22.5 run were hit within 60 frames from 3.0-3.6), and never
  # where the opponent's fastest known projectile could arrive before the charge ends
  range: {enabled: true, min_dist: 3.5, chance: 0.12, roll_every_s: 0.5, max_approach: 0.02}
# 0.20.3 (user: "Jump ins are supposed to be used after a successful DI stun"): the combo lab's TRUE jump-in routes after the
# bot's Drive Impact crumples the opponent. MEASURED: the crumple lasts ~150 frames (112-159), ~70 left when the bot can
# act, the opponent ~0.75 away -> a NEUTRAL jump (user's choice). ESTIMATES: stun_frames, jump_hit_frames (pre-jump +
# fall to a deep hit), vs_super (the route's expected damage must reach this share of SA3's).
stun_jump_in:
  # 0.37.0 (user, 2026-10-08: "When Ryu counters a DI, he should never begin an attack with a jumping attack. The DI crumple
  # causes the jumping attack to be the only attack that hits, no further attack can hit"): off; the crumple is cashed out
  # with the super / ground combo choice (0.30.1)
  enabled: false
  stun_frames: 140
  jump_hit_frames: 44
  neutral_jump_below: 1.2
  vs_super: 0.8
# 0.37.0 (user: "The bot still refuses to DI burned-out opponents. When an opponent is in burnout, Ryu should play
# aggressively to attempt to chip their health down, and get them into the corner for the stun"; "When the enemy is in
# burnout, pressure should increase, not decrease"). MEASURED (0.36.1 ranked): 18,599 frames with the opponent in burnout,
# 1 Drive Impact on it. A Drive Impact at a burned-out opponent that is not attacking, when it will reach (its hitbox,
# drive_impact_hitbox) and the bot keeps a bar after it; against a Super bar only with the opponent's back near its wall
# (a blocked DI there stuns: the payoff is worth the risk). chance per decision / cooldown are ESTIMATES.
burnout_di:
  enabled: true
  chance: 0.35
  cooldown_s: 1.5
  wall_dist: 2.5
# 0.19.0: Drive Impact against an opponent with its back to the wall: blocked or not it stuns against the wall. ESTIMATES:
# the wall distance for the stun (max_back), and how often a chance is taken (chance per decision, cooldown).
di_wall:
  enabled: false           # 0.20.7 (user): no Drive Impact from neutral, cornered opponent or not
  max_back: 1.5            # the opponent's back this close to its wall
  min_dist: 0.8
  max_dist: 2.6            # Drive Impact's travel (also capped by the measured reach)
  min_drive: 20000         # 2 bars: one left after it (never into burnout unless the damage kills)
  chance: 0.15             # per roll; one roll per roll_every_s while the chance lasts
  roll_every_s: 0.5
  cooldown_s: 4.0
# 0.18.3: after knocking the opponent down, walk in so their get-up is a pressure moment of the bot's (above)
oki:
  enabled: true
  walk_until: 0.9          # stop walking in at this distance
  max_dist: 3.2            # farther than this: not worth the walk
# 0.14.0: block only what can reach; punish what whiffed (sf6bot/fighter.py rule 6).
whiff_punish:
  enabled: true
  active_frames_guess: 4   # an opponent move counts as recovering this many frames after its first active frame
                           # (Capcom start-up; active lengths are not in the match data: an assumption)
  reach_margin: 0.0        # own move used only within its measured reach (reach.py, menu B)
  # 0.20.0 (user: "punish moves based on proximity to the enemy, as well as their last whiffed move"): out of every poke's
  # reach, step in first when the frames left allow. MEASURED (0.19.0 ranked, Ryu): forward walk 0.047 a frame (n 7,355),
  # forward dash 21 frames for 1.25 (n 81).
  walk_speed: 0.047
  walk_gap: 0.5
  dash_gap: 1.25
  dash_frames: 21
  block_margin: 0.3        # block an opponent move only within its measured reach + this
# 0.40.0 (user, 2026-10-08: "players who took advantage of clear patterns in its play ... by round 2, a human in High
# Master can immediately tell what's happening"): what this opponent beat, kept for the match and a rematch (adapt.py).
# MEASURED (0.38.2 / 0.39.0 ranked, 59 matches): rounds won R1 34-25, R2 29-28, R3 9-14.
adapt:
  enabled: true
  burn_after: 3          # a button used this often from about the same distance ...
  band: 0.25             # ... (within this much) ...
  burn_net: -500         # ... that lost this much on net (dealt - taken in `window` frames after each press) ...
  window: 40
  burn_factor: 0.1       # ... is chosen this much as often there for the rest of the match
  walk_margin: 0.15      # walking in from where a poke caught the bot walking in (+ this) or closer ...
  walk_factor: 0.2       # ... is chosen this much as often
  jump_burn_after: 1     # the fireball jump-in, once anti-aired / punished on landing
  rush_burn_after: 1     # (0.40.0; unused since 0.41.0: the rush check is a mix, adapt.RUSH_*)
  poke_after: 2          # 0.41.0: an opponent normal that beat the bot's button this often from about here (poke_band) ...
  poke_band: 0.2
  poke_factor: 0.3       # ... slow buttons (start-up over poke_fast) and walks in are chosen this much as often there
  poke_fast: 5
  carry_s: 180           # a rematch against the same character within this keeps the memory

