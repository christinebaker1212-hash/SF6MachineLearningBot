<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF6 BOT</title>
<style>
/* SF6 BOT control panel. Style after SF6's menus (own values, no Capcom assets): near-black, bold slanted
   uppercase type, hot magenta / yellow / cyan accents, slanted tabs and buttons, cut-corner cards.
   Sized for the strip under the game (1280 x ~260 physical pixels at 125% = ~1024 x 208 CSS pixels);
   larger windows get more rows, narrow ones stack the log under the cards. */
:root {
  --bg: #07070b; --panel: #15151e; --panel2: #1d1d29; --line: #262634;
  --ink: #f4f4f7; --muted: #a3a3b6; --dim: #6c6c80;
  --magenta: #ff2d8a; --yellow: #ffd400; --cyan: #19e3ff; --green: #38f28c; --violet: #a46bff;
  --head: "Bahnschrift", "Bahnschrift SemiBold", "DejaVu Sans Condensed", "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --body: "Bahnschrift", "Segoe UI", "DejaVu Sans", sans-serif;
  --mono: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  display: flex; flex-direction: column; color: var(--ink); font-family: var(--body); font-size: 12px;
  background:
    radial-gradient(ellipse 40% 90% at 0% 100%, #ff2d8a1f, transparent 70%),
    radial-gradient(ellipse 35% 80% at 100% 0%, #19e3ff14, transparent 70%),
    repeating-linear-gradient(115deg, #ffffff05 0 2px, transparent 2px 9px),
    var(--bg);
  user-select: none;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.slant { transform: skewX(-14deg); }
.slant > span { display: inline-block; transform: skewX(14deg); }

/* ---- top bar: logo, tabs, status, window buttons ---- */
#top { flex: none; height: 36px; display: flex; align-items: center; gap: 8px; padding-right: 8px;
       background: linear-gradient(#14141c, #0b0b10); border-bottom: 2px solid #ff2d8a55; }
#logo { position: relative; height: 36px; padding: 0 26px 0 12px; display: flex; align-items: center; gap: 8px;
        background: var(--magenta); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); flex: none; }
#logo::after { content: ""; position: absolute; right: 2px; top: 0; width: 9px; height: 100%;
               background: var(--yellow); clip-path: polygon(60% 0, 100% 0, 40% 100%, 0 100%); }
#logo b { font: italic 900 19px/1 var(--head); letter-spacing: .02em; color: var(--bg); font-stretch: condensed; }
#logo i { font: normal 700 10px/1 var(--body); color: #07070bcc; }
#tabs { display: flex; gap: 3px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1; padding-left: 4px; }
#tabs::-webkit-scrollbar { display: none; }
.tab { height: 26px; padding: 0 10px; background: var(--panel2); border-left: 3px solid var(--c);
       font: italic 800 12.5px/26px var(--head); text-transform: uppercase; letter-spacing: .03em; color: var(--ink);
       white-space: nowrap; flex: none; }
.tab:hover { background: #2a2a3a; }
.tab.on { background: var(--c); color: var(--bg); box-shadow: 0 0 14px -2px var(--c); }
#status { flex: none; display: flex; align-items: center; gap: 6px; font: italic 800 13px var(--head);
          text-transform: uppercase; color: var(--green); white-space: nowrap; max-width: 260px; overflow: hidden; }
#status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex: none; }
#status.run { color: var(--yellow); } #status.run .dot { animation: pulse .8s infinite alternate; }
#status.stop { color: var(--magenta); }
@keyframes pulse { to { opacity: .25; } }
.tbtn { height: 26px; padding: 0 11px; background: var(--panel2); font: italic 800 12px/26px var(--head);
        text-transform: uppercase; white-space: nowrap; flex: none; border-bottom: 2px solid #ffffff22; }
.tbtn:hover { background: var(--yellow); color: var(--bg); }
.tbtn.stop { background: var(--magenta); color: var(--ink); box-shadow: 0 0 12px -3px var(--magenta); }
.tbtn.stop:hover { background: var(--ink); color: var(--magenta); }
.tbtn.stop.idle { opacity: .45; box-shadow: none; }
.key { display: inline-block; padding: 0 4px; margin-left: 4px; border: 1px solid currentColor; border-radius: 3px;
       font: normal 700 10px/14px var(--body); opacity: .85; }

/* ---- main: cards + log ---- */
#main { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 6px; }
#cards { flex: 1; min-width: 0; display: grid; grid-auto-flow: column dense;
         grid-template-rows: repeat(auto-fill, minmax(56px, 1fr)); grid-auto-columns: minmax(232px, 262px);
         gap: 6px; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; scrollbar-width: thin;
         scrollbar-color: var(--magenta) transparent; }
#cards { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
#cards::-webkit-scrollbar { height: 5px; } #cards { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
#cards::-webkit-scrollbar-thumb { background: var(--c, var(--magenta)); }
.card { position: relative; min-height: 0; display: flex; flex-direction: column; padding: 5px 9px 6px 11px;
        background: linear-gradient(135deg, var(--panel2), var(--panel) 60%); border-left: 4px solid var(--c);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); overflow: hidden; }
.card::before { content: ""; position: absolute; right: -30px; top: -30px; width: 80px; height: 80px;
                background: radial-gradient(circle, var(--c), transparent 70%); opacity: .12; pointer-events: none; }
.card.big { grid-row: span 2; }
.card:hover { background: linear-gradient(135deg, #262636, var(--panel) 65%); }
.card .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card h3 { margin: 0; flex: 1; min-width: 0; font: italic 900 15px/1.1 var(--head); font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .02em;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card p { margin: 2px 0 0; color: var(--muted); font-size: 11px; line-height: 1.25; overflow: hidden;
          display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.card:not(.big) p { font-size: 10.5px; line-height: 1.2; }
.opt { display: flex; align-items: center; gap: 5px; margin-top: 3px; min-width: 0; }
.opt > label { flex: none; width: 58px; color: var(--c); font: italic 800 10px var(--head); text-transform: uppercase; }
.seg { display: flex; gap: 2px; flex-wrap: nowrap; min-width: 0; }
.seg button { padding: 2px 7px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
.seg button:hover { border-color: var(--c); }
.seg button.on { background: var(--c); color: var(--bg); border-color: var(--c); font-weight: 700; }
select, input[type=text] { min-width: 0; flex: 1; height: 21px; padding: 0 6px; background: #0a0a10; color: var(--ink);
       border: 1px solid var(--line); font: 12px var(--body); outline: none; }
select:focus, input[type=text]:focus { border-color: var(--c); box-shadow: 0 0 6px -1px var(--c); }
input.num { flex: 0 0 46px; }
.hint { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.go { height: 22px; padding: 0 11px; background: var(--yellow); color: var(--bg);
      font: italic 900 12px/22px var(--head); text-transform: uppercase; letter-spacing: .04em; flex: none; }
.go:hover { background: var(--ink); box-shadow: 0 0 10px -2px var(--yellow); }
.card.running { box-shadow: inset 0 0 0 2px var(--yellow); }

#side { flex: 0 0 38%; min-width: 300px; max-width: 540px; display: flex; flex-direction: column; min-height: 0;
        background: #0c0c12ee; border: 1px solid var(--line); border-top: 2px solid var(--cyan); }
#loghead { flex: none; display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 4px 0 8px; }
#loghead b { font: italic 900 12px var(--head); color: var(--cyan); text-transform: uppercase; letter-spacing: .05em; }
#loghead span { flex: 1; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#loghead button { padding: 1px 8px; background: var(--panel2); color: var(--muted); font-size: 10px; text-transform: uppercase; }
#log { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 2px 8px 4px; font: 11.5px/1.35 var(--mono);
       white-space: pre-wrap; word-break: break-word; color: #dcdce6; user-select: text; scrollbar-width: thin;
       scrollbar-color: var(--cyan) transparent; }
#log .measured { color: var(--cyan); } #log .learned { color: var(--yellow); } #log .policy { color: #ff7ab8; }
#log .bad { color: #ff5b9c; } #log .good { color: var(--green); } #log .me { color: var(--dim); }
#ans { flex: none; display: flex; gap: 3px; padding: 4px; border-top: 1px solid var(--line); }
#ans input { height: 24px; font-family: var(--mono); }
#ans button { height: 24px; padding: 0 9px; background: var(--panel2); font: italic 800 11px var(--head); text-transform: uppercase; }
#ans button.send { background: var(--yellow); color: var(--bg); }
#ans button:hover { background: var(--ink); color: var(--bg); }
#ans.waiting { box-shadow: inset 0 0 0 2px var(--yellow); animation: glow 1s infinite alternate; }
@keyframes glow { to { box-shadow: inset 0 0 0 2px #ffd40033; } }

/* modal (a step that needs an OK first, e.g. "set the dummy's guard to ALL") */
#modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000c; z-index: 9; }
#modal.on { display: flex; }
#modal div { max-width: 560px; padding: 12px 16px; background: var(--panel); border-left: 5px solid var(--yellow); }
#modal p { margin: 0 0 10px; font: italic 800 15px/1.3 var(--head); }
#modal button { margin-right: 6px; padding: 3px 16px; font: italic 900 13px var(--head); background: var(--yellow); color: var(--bg); }
#modal button.no { background: var(--panel2); color: var(--ink); }

/* narrow windows: log under the cards */
@media (max-width: 720px) {
  #main { flex-direction: column; }
  #side { flex: 1 1 45%; max-width: none; min-width: 0; }
  #cards { flex: 0 0 auto; height: 60%; }
  .card:not(.big) p { display: none; }
  #logo i, #status .txt { display: none; }
}
@media (max-height: 200px) { .card.big p { -webkit-line-clamp: 1; } }
@media (max-height: 150px) { .card p { display: none; } }
</style>
</head>
<body>
<div id="top">
  <div id="logo"><b>SF6 BOT</b><i id="ver"></i></div>
  <div id="tabs"></div>
  <div id="status"><span class="dot"></span><span class="txt">READY</span></div>
  <button class="tbtn slant" id="arrange" title="SF6 to the top right (title bar visible), this panel under it"><span>Arrange</span></button>
  <button class="tbtn slant stop" id="stop" title="Stop the running command like F8 (inputs released, files saved)"><span>Stop<span class="key">F8</span></span></button>
</div>
<div id="main">
  <div id="cards"></div>
  <div id="side">
    <div id="loghead"><b>Live log</b><span id="running"></span><button id="video" title="Record video.mp4 in each run (costs CPU and disk); click to switch">Video ?</button><button id="clear">Clear</button></div>
    <pre id="log"></pre>
    <div id="ans">
      <input type="text" id="answer" placeholder="answer here when the log asks a question" autocomplete="off">
      <button class="send" data-t="">Send</button><button data-v="">Enter</button><button data-v="yes">Yes</button><button data-v="S">S</button>
    </div>
  </div>
</div>
<div id="modal"><div><p id="mtext"></p><button id="mok">OK</button><button class="no" id="mno">Cancel</button></div></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
let INIT = null, TAB = "fight", VALUES = {}, SINCE = 0, RUNNING = false, SAVE_T = null, ASKED = null;
const COLORS = {magenta: "var(--magenta)", yellow: "var(--yellow)", cyan: "var(--cyan)", violet: "var(--violet)", green: "var(--green)"};
const GO = {share: "Copy", open_runs: "Open"};

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  return r.json();
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderTabs() {
  const box = $("#tabs"); box.innerHTML = "";
  for (const t of INIT.tabs) {
    const b = el("button", "tab slant" + (t.key === TAB ? " on" : ""));
    b.style.setProperty("--c", COLORS[t.color]);
    b.appendChild(el("span", null, t.label));
    b.onclick = () => { TAB = t.key; renderTabs(); renderCards(); saveSoon(); };
    box.appendChild(b);
  }
}
function setVal(aid, key, v) { (VALUES[aid] = VALUES[aid] || {})[key] = v; saveSoon(); }
function getVal(aid, o) { const v = (VALUES[aid] || {})[o.key]; return v == null ? (o.default == null ? "" : String(o.default)) : String(v); }

function renderCards() {
  const box = $("#cards"); box.innerHTML = "";
  const color = COLORS[INIT.tabs.find(t => t.key === TAB).color];
  box.style.setProperty("--c", color);
  for (const a of INIT.actions.filter(a => a.tab === TAB)) {
    const c = el("div", "card" + (a.options.length ? " big" : ""));
    c.style.setProperty("--c", color);
    c.dataset.id = a.id;
    const head = el("div", "head");
    const h = el("h3", null, a.title); h.title = a.title; head.appendChild(h);
    const go = el("button", "go slant"); go.appendChild(el("span", null, (GO[a.special] || "Go") + " ▶"));
    go.onclick = () => run(a.id);
    head.appendChild(go); c.appendChild(head);
    const p = el("p", null, a.desc); p.title = a.desc; c.appendChild(p);
    for (const o of a.options) {
      const row = el("div", "opt"); row.appendChild(el("label", null, o.label));
      if (o.kind === "choice" && o.choices.length <= 3) {
        const seg = el("div", "seg");
        const paint = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === getVal(a.id, o)));
        for (const [shown, val] of o.choices) {
          const b = el("button", null, shown); b.dataset.v = String(val);
          b.onclick = () => { setVal(a.id, o.key, String(val)); paint(); };
          seg.appendChild(b);
        }
        paint(); row.appendChild(seg);
      } else if (o.kind === "choice") {
        const s = el("select");
        for (const [shown, val] of o.choices) { const op = el("option", null, shown); op.value = String(val); s.appendChild(op); }
        s.value = getVal(a.id, o); s.onchange = () => setVal(a.id, o.key, s.value); row.appendChild(s);
      } else {
        const i = el("input"); i.type = "text"; i.value = getVal(a.id, o); i.placeholder = o.hint || "";
        if (o.kind === "int") i.className = "num";
        i.oninput = () => setVal(a.id, o.key, i.value); row.appendChild(i);
        if (o.hint && o.kind === "int") { const hn = el("span", "hint", o.hint); hn.title = o.hint; row.appendChild(hn); }
      }
      c.appendChild(row);
    }
    box.appendChild(c);
  }
  box.scrollLeft = 0;
  markRunning();
}
function markRunning() {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("running", RUNNING && c.dataset.id === (INIT.current || "")));
}
function saveSoon() { clearTimeout(SAVE_T); SAVE_T = setTimeout(() => api("/api/values", {tab: TAB, values: VALUES}), 400); }

async function run(id) { await api("/api/run", {id, values: VALUES[id] || {}}); poll(true); }
async function send(text) { await api("/api/send", {text}); $("#answer").value = ""; }

function append(chunks) {
  const log = $("#log");
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  for (const ch of chunks) { const s = el("span", ch.tag || null, ch.text); log.appendChild(s); }
  while (log.childNodes.length > 6000) log.removeChild(log.firstChild);
  if (atEnd) log.scrollTop = log.scrollHeight;
}
let POLLING = false;
async function poll(once) {
  if (POLLING && once) return;
  POLLING = true;
  try {
    const r = await api("/api/poll?since=" + SINCE);
    if (r.reset) { $("#log").innerHTML = ""; }
    append(r.chunks); SINCE = r.next;
    RUNNING = r.running; INIT.current = r.action;
    const st = $("#status"); st.className = r.stopping ? "stop" : RUNNING ? "run" : "";
    st.querySelector(".txt").textContent = r.stopping ? "Stopping" : RUNNING ? "Running" : "Ready";
    st.title = r.status;
    $("#running").textContent = RUNNING ? r.status.replace("RUNNING: ", "") + " · " + r.command : "";
    $("#video").textContent = "Video " + r.video;
    $("#ans").classList.toggle("waiting", !!r.prompt);
    $("#stop").classList.toggle("idle", !RUNNING);
    markRunning();
    if (r.ask && r.ask.id !== ASKED) { ASKED = r.ask.id; $("#mtext").textContent = r.ask.text; $("#modal").classList.add("on"); }
  } catch (e) { /* the panel's server restarting or gone: keep trying */ }
  POLLING = false;
  if (!once) setTimeout(poll, RUNNING ? 150 : 400);
}
async function answerAsk(ok) { $("#modal").classList.remove("on"); await api("/api/confirm", {id: ASKED, ok}); }

async function main() {
  INIT = await api("/api/init");
  TAB = INIT.tab || "fight"; VALUES = INIT.values || {};
  $("#ver").textContent = "v" + INIT.version;
  renderTabs(); renderCards();
  $("#tabs").addEventListener("wheel", e => { $("#tabs").scrollLeft += e.deltaY; e.preventDefault(); }, {passive: false});
  $("#cards").addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $("#cards").scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive: false});
  $("#stop").onclick = () => api("/api/stop", {});
  $("#arrange").onclick = () => run("arrange");
  $("#video").onclick = () => run("video");
  $("#clear").onclick = () => { $("#log").innerHTML = ""; };
  $("#answer").addEventListener("keydown", e => { if (e.key === "Enter") send($("#answer").value); });
  document.querySelectorAll("#ans button").forEach(b => b.onclick = () => send(b.dataset.v != null ? b.dataset.v : $("#answer").value));
  $("#mok").onclick = () => answerAsk(true); $("#mno").onclick = () => answerAsk(false);
  window.addEventListener("beforeunload", e => { if (RUNNING) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("pagehide", () => navigator.sendBeacon("/api/closing", "{}"));
  poll();
}
main();
</script>
</body>
</html>
