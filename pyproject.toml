[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sf6bot"
version = "0.3.0"
description = "Experimental machine-learning agent for Street Fighter 6 (screen capture + keyboard input)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Windows game integration. dxcam = DXGI Desktop Duplication capture with present timestamps.
windows = ["dxcam[cv2]>=0.3.0", "pywin32>=306"]
# Cross-platform fallback capture (no present timestamps). Also usable on Linux for dev.
mss = ["mss>=9.0"]
# torch is installed separately (CUDA build): see CLAUDE.md
dev = ["pytest>=8"]

[project.scripts]
sf6bot = "sf6bot.cli:main"

[tool.setuptools.packages.find]
include = ["sf6bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
